name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          # MODULE-PATH-RENAME: the -X flags below embed the Go module path
          # github.com/opentofu/opentofu; update them when the module is
          # renamed to github.com/intentius/choudoufu.
          go build -trimpath \
            -ldflags "-X 'github.com/opentofu/opentofu/version.Fork=${GITHUB_REF_NAME}' -X 'github.com/opentofu/opentofu/version.dev=no'" \
            -o dist/choudoufu ./cmd/choudoufu
          tar -C dist -czf "choudoufu_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}.tar.gz" choudoufu
      - name: Verify reported version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/choudoufu version
          ./dist/choudoufu version | grep -F "choudoufu ${GITHUB_REF_NAME} (based on OpenTofu"
      - uses: actions/upload-artifact@v4
        with:
          name: choudoufu-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            *.tar.gz SHA256SUMS
