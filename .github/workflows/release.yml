name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -o dist/choudoufu ./cmd/choudoufu
          tar -C dist -czf "choudoufu_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}.tar.gz" choudoufu
      - uses: actions/upload-artifact@v4
        with:
          name: choudoufu-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both versions belong in the notes: the fork release and the
          # upstream OpenTofu it is built on (version/VERSION, minus the
          # -dev suffix that marks an unreleased upstream tree).
          upstream=$(sed 's/-dev$//' src/version/VERSION)
          cat > NOTES.md <<EOF
          choudoufu $GITHUB_REF_NAME, built on OpenTofu $upstream (fork point [\`03743ce6e8\`](https://github.com/opentofu/opentofu/commit/03743ce6e8)).

          Everything outside live resource markers is stock OpenTofu $upstream. Binaries below are macOS and Linux, amd64 and arm64; verify with \`SHA256SUMS\`.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file NOTES.md --generate-notes \
            *.tar.gz SHA256SUMS
