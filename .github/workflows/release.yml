name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Gate: the same gofmt, build and Go unit tier as pull requests (ci.yml).
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          bin=choudoufu
          if [ "$GOOS" = "windows" ]; then
            bin=choudoufu.exe
          fi
          # MODULE-PATH-RENAME: the -X flags below embed the Go module path
          # github.com/intentius/choudoufu; update them when the module is
          # renamed to github.com/intentius/choudoufu.
          go build -trimpath \
            -ldflags "-X 'github.com/intentius/choudoufu/version.Fork=${GITHUB_REF_NAME}' -X 'github.com/intentius/choudoufu/version.dev=no'" \
            -o "dist/$bin" ./cmd/choudoufu
          # Windows ships as .zip, which Explorer opens with no extra
          # tooling; macOS and Linux keep the .tar.gz they have always
          # shipped as. SHA256SUMS below covers both extensions.
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -q "../choudoufu_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}.zip" "$bin")
          else
            tar -C dist -czf "choudoufu_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}.tar.gz" "$bin"
          fi
      - name: Verify reported version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/choudoufu version
          ./dist/choudoufu version | grep -F "choudoufu ${GITHUB_REF_NAME} (based on OpenTofu"
      - uses: actions/upload-artifact@v7
        with:
          name: choudoufu-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Install cosign
        env:
          COSIGN_VERSION: "2.6.5"
        run: |
          base="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLo cosign-linux-amd64 "$base/cosign-linux-amd64"
          curl -fsSLo cosign_checksums.txt "$base/cosign_checksums.txt"
          grep '  cosign-linux-amd64$' cosign_checksums.txt | sha256sum -c -
          sudo install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
          cosign version
      - name: SBOM
        run: |
          # One SPDX document for the release: every archive is built from
          # the same module graph, so its Go modules are the packages.
          (cd src && go list -m -json all) | jq -s \
            --arg name "choudoufu_${GITHUB_REF_NAME}" \
            --arg ns "https://github.com/${GITHUB_REPOSITORY}/releases/${GITHUB_REF_NAME}/sbom" \
            --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
              spdxVersion: "SPDX-2.3",
              dataLicense: "CC0-1.0",
              SPDXID: "SPDXRef-DOCUMENT",
              name: $name,
              documentNamespace: $ns,
              creationInfo: { created: $created, creators: ["Tool: go list -m", "Organization: INTENTIUS"] },
              packages: [ .[] | {
                name: .Path,
                SPDXID: ("SPDXRef-Package-" + (.Path | gsub("[^A-Za-z0-9.-]"; "-"))),
                versionInfo: (.Version // "'"${GITHUB_REF_NAME}"'"),
                downloadLocation: "NOASSERTION",
                filesAnalyzed: false,
                externalRefs: [ { referenceCategory: "PACKAGE-MANAGER", referenceType: "purl",
                  referenceLocator: ("pkg:golang/" + .Path + (if .Version then "@" + .Version else "" end)) } ]
              } ]
            }' > "choudoufu_${GITHUB_REF_NAME}.spdx.json"
      - name: Sign and attest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # Each archive gets a signature, SLSA v1 provenance and an SBOM
          # attestation, cosign bundles made with the release key and no
          # transparency log. terragucci verifies them against the cosign.pub
          # committed here (INTENTIUS/terragucci#953). A release with no key
          # fails here rather than shipping unsigned.
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is not set; a release is signed with the key whose public half is cosign.pub" >&2
            exit 1
          fi
          commit=$(git -C src rev-parse HEAD)
          sbom="choudoufu_${GITHUB_REF_NAME}.spdx.json"
          for a in ./*.tar.gz ./*.zip; do
            a=${a#./}
            digest=$(sha256sum "$a" | cut -d' ' -f1)
            jq -n --arg tag "$GITHUB_REF_NAME" --arg commit "$commit" --arg digest "sha256:$digest" \
              --arg repo "$GITHUB_REPOSITORY" --arg server "$GITHUB_SERVER_URL" --arg run "$GITHUB_RUN_ID" \
              --arg finished "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
                buildDefinition: {
                  buildType: "https://github.com/INTENTIUS/choudoufu/release/v1",
                  externalParameters: { workflow: ".github/workflows/release.yml", tag: $tag, sourceRef: $commit },
                  internalParameters: { artifactDigest: $digest },
                  resolvedDependencies: [ { uri: ("git+" + $server + "/" + $repo + "@refs/tags/" + $tag), digest: { gitCommit: $commit } } ]
                },
                runDetails: {
                  builder: { id: ($server + "/" + $repo + "/.github/workflows/release.yml@refs/tags/" + $tag) },
                  metadata: { invocationId: ($server + "/" + $repo + "/actions/runs/" + $run), finishedOn: $finished }
                }
              }' > "$RUNNER_TEMP/provenance.json"
            cosign sign-blob --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY --bundle "$a.sig.bundle" "$a"
            cosign attest-blob --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY --type slsaprovenance1 --predicate "$RUNNER_TEMP/provenance.json" --bundle "$a.provenance.bundle" "$a"
            cosign attest-blob --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY --type spdxjson --predicate "$sbom" --bundle "$a.sbom.bundle" "$a"
          done
      - name: Verify signatures
        run: |
          # What the key signed must verify against the committed public
          # key, or the secret and cosign.pub are not one key pair.
          for a in ./*.tar.gz ./*.zip; do
            a=${a#./}
            cosign verify-blob --key src/cosign.pub --insecure-ignore-tlog=true --bundle "$a.sig.bundle" "$a"
            cosign verify-blob-attestation --key src/cosign.pub --insecure-ignore-tlog=true --type slsaprovenance1 --bundle "$a.provenance.bundle" "$a"
            cosign verify-blob-attestation --key src/cosign.pub --insecure-ignore-tlog=true --type spdxjson --bundle "$a.sbom.bundle" "$a"
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both versions belong in the notes: the fork release and the
          # upstream OpenTofu it is built on. The base is the fork point's
          # own version/VERSION, verbatim: a -dev tree is unreleased
          # upstream main, not the release it precedes (#1778). Version and
          # fork point both come from live/fork-surface.json
          # (tools/forkdiff-gen), so neither is typed here; the tree's own
          # version/VERSION must agree, or that artifact is stale.
          surface=src/live/fork-surface.json
          upstream=$(jq -r '.base_opentofu_version // empty' "$surface")
          fork=$(jq -r '.fork_point_short // empty' "$surface")
          tree=$(tr -d '[:space:]' < src/version/VERSION)
          if [ -z "$upstream" ] || [ -z "$fork" ]; then
            echo "::error::$surface lacks base_opentofu_version or fork_point_short" >&2
            exit 1
          fi
          if [ "$upstream" != "$tree" ]; then
            echo "::error::$surface says base $upstream but version/VERSION reads $tree; run go run ./tools/forkdiff-gen" >&2
            exit 1
          fi
          cat > NOTES.md <<EOF
          choudoufu $GITHUB_REF_NAME, built on OpenTofu $upstream (fork point [\`$fork\`](https://github.com/opentofu/opentofu/commit/$fork)).

          Everything outside live resource markers is stock OpenTofu $upstream. Binaries below are macOS, Linux and Windows, amd64 and arm64; macOS and Linux are \`.tar.gz\`, Windows is \`.zip\`; verify with \`SHA256SUMS\`.

          Each archive has a signature (\`.sig.bundle\`), SLSA v1 provenance (\`.provenance.bundle\`) and an SBOM attestation (\`.sbom.bundle\`), cosign bundles signed with the key in [\`cosign.pub\`](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/cosign.pub): \`cosign verify-blob --key cosign.pub --insecure-ignore-tlog=true --bundle <archive>.sig.bundle <archive>\`. The SBOM itself is \`choudoufu_$GITHUB_REF_NAME.spdx.json\`.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file NOTES.md --generate-notes \
            ./*.tar.gz ./*.zip SHA256SUMS ./*.bundle "choudoufu_${GITHUB_REF_NAME}.spdx.json"
