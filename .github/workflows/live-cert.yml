name: Live cert

# A real-AWS certification run (issue #440, #567, #1032, #1046) - the one
# kind of gauntlet evidence that spends real account money. `workflow_dispatch`
# only, on purpose: this is a "heavy run" under CLAUDE.md's "Heavy and paid
# runs are the maintainer's, by hand" rule: the account's AWS Budgets alarm
# bounds spend, and this workflow's required reviewer is the maintainer's
# decision for a dispatched run (#1102 removed the three local gates on
# 2026-09-14; a laptop run is the maintainer's own command with nothing to
# unlock).
#
# `environment: real-aws` is what makes a dispatch wait: a GitHub
# environment with a required reviewer blocks the job at its first step
# until the maintainer approves it by hand, in the Actions UI, no matter who
# or what dispatched the run. That protection rule and the CHOUDOUFU_LIVECERT_ROLE_ARN
# / AWS_REGION repository variables are a repository setting, not code - see
# HANDOFF.md "Heavy runs are dispatched, approved and never local" for the
# exact one-time `gh api`/`gh variable set` calls, also echoed by
# `just heavy-runs-setup`.
#
# Only reference-ec2-vpc and terralith-scale have a live/live-cert/<estate>.sh
# script today (LiveCertScript, tools/gauntlet/livecert.go); the `estate`
# choice below is exactly that list. -ceiling-usd is informational to the
# tool itself (RunLiveCert's own doc comment) - the account's AWS Budgets
# alarm and this job's timeout-minutes are the real backstops.
#
# LIVECERT_HOLD, LIVECERT_RESUME and LIVECERT_TEARDOWN_ONLY are deliberately
# NOT inputs here, though #1051 asked for them. They exist so a run can leave
# the estate standing and a later run can plan against it without paying for
# cold_deploy and migrate again, and every one of them addresses a work dir
# by path. On a hosted runner that directory dies with the job. A held
# dispatch would therefore leave a live, billing estate with no later
# dispatch able to name it, resume it, or tear it down - the one failure this
# workflow must not be able to cause. The hold/resume loop is a local one,
# driven by the maintainer against a work dir that outlives the process;
# terralith-scale.sh's own header documents it, and a CI run is the
# all-the-way-through pass that tears down and verifies the account empty.
#
# Never pushes main: the result lands on a fresh live-cert/<run id> branch
# and a pull request, the same shape gauntlet.yml uses for its nightly
# artifact, so a maintainer still reviews what a real account run recorded
# before it reaches live/gauntlet.json on main.

on:
  workflow_dispatch:
    inputs:
      estate:
        description: "which live-cert estate to certify"
        type: choice
        options:
          - terralith-scale
          - reference-ec2-vpc
        default: reference-ec2-vpc
      scale:
        description: "terralith-gen's -scale (terralith-scale only; SCALE env var, ignored by reference-ec2-vpc)"
        default: "1"
      ceiling_usd:
        description: "cost ceiling this run is certifying under (informational here; enforced by the account's own AWS Budgets alarm)"
        default: "15"
      timeout_minutes:
        description: "job ceiling in minutes. 350 carries a 10k run; GitHub caps a hosted-runner job at 360, so a size that needs more than that cannot be dispatched here and has to be driven by hand"
        default: "350"
      index_wait_s:
        description: "LIVECERT_INDEX_WAIT_S: seconds to wait for the tagging index to catch up with migrate's writes before test_plan. 1800 is the script default and was measured against 1,655 stamped resources; a 10k run writes six times that, so raise it here rather than watching test_plan refuse"
        default: "1800"

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: live-cert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Was a hard 60 (#1102's other open item), which no real estate fits
    # inside: the 3,705-resource run took over three hours. An input, so one
    # dispatch can be a quick reference-ec2-vpc pass and the next a 10k
    # terralith, and so raising it is a decision recorded on the run rather
    # than an edit to this file.
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes) }}
    environment: real-aws
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read the pinned stock oracle version (issue #544)
        id: oracle
        run: echo "terraform=$(jq -r .terraform_version live/oracle-versions.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@v3
        with:
          # Pinned, not "latest" - see the identical comment in gauntlet.yml
          # and ci.yml (issue #544, root cause of #498). This is TF_COLD_BIN's
          # implicit default ("terraform" on PATH) for cold_deploy's stock
          # apply; the estate scripts fail loudly if it is missing.
          terraform_version: ${{ steps.oracle.outputs.terraform }}
          terraform_wrapper: false

      # Short-lived, OIDC-minted credentials for the one live-cert role -
      # examples/ci-pipelines/README.md's "Setting up OIDC for this smoke"
      # is the same shape (three roles instead of one, same provider,
      # same account). No stored key: the run mints a token, this action
      # exchanges it for credentials that expire with the job.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CHOUDOUFU_LIVECERT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build choudoufu
        # CGO_ENABLED=0 for the same reason as gauntlet.yml's identical step
        # (issue #946): a static binary, no glibc dependency.
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/choudoufu" ./cmd/choudoufu

      # Built, not `go run`, and that is issue #1324 rather than a style
      # preference. `go run` compiles to a cache path and execs the result as
      # a CHILD, and it does not pass a signal on to it: measured on
      # go1.26.5, `kill -TERM` on a `go run` pid killed the wrapper alone,
      # the compiled binary reparented to init and kept going with its bash
      # script and that script's `terraform plan` underneath it, trap unrun.
      # That is how a cancelled scale-128 run left 9,477 billable resources
      # standing while its rc file said 143.
      #
      # When a runner cancels this step it signals the step's process group,
      # and with `go run` the pid holding the work is not the pid that gets
      # to hear about it. Building first makes the signalled pid the one
      # holding the work, which is the only shape where the tool's own
      # forwarding can reach the teardown trap at all.
      - name: Build the gauntlet runner
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/gauntlet" ./tools/gauntlet

      - name: Run the live-cert certification
        id: livecert
        env:
          # TOFU_BIN skips live/live-cert/<estate>.sh's own `go build` step
          # (that script's doc comment) in favor of the binary just built.
          TOFU_BIN: ${{ runner.temp }}/choudoufu
          # A known path, not the script's default mktemp -d, so the upload
          # step below can find it after the process exits either way.
          LIVECERT_WORK_DIR: ${{ runner.temp }}/livecert-work
          # This IS the maintainer's approval: reaching this step already
          # required the real-aws environment's required reviewer to click
          # approve.
          SCALE: ${{ github.event.inputs.scale }}
          LIVECERT_INDEX_WAIT_S: ${{ github.event.inputs.index_wait_s }}
        run: |
          set -o pipefail
          mkdir -p "$LIVECERT_WORK_DIR"
          # -timeout-seconds is derived from the job's own ceiling rather than
          # left at its default, minus two minutes so the Go side stops the
          # script and the "Keep the work dir and the log" step still runs.
          # A job GitHub cancels outright uploads nothing.
          #
          # On cancellation (#1324): the runner signals this step and then
          # kills it after a short grace period - seconds, not minutes. The
          # tool forwards that signal to the script's whole process group and
          # waits for its teardown trap for as long as the trap takes, and
          # with the build above it is the tool that gets signalled rather
          # than a `go run` wrapper. The runner sends SIGINT and then
          # SIGTERM, which the tool treats as ONE stop request: a second
          # signal is never an instruction to abandon an estate.
          #
          # What the grace period CANNOT do is let the teardown finish.
          # Destroying a scale-128 estate and verifying it empty by listing
          # is tens of minutes, and the runner kills the process group long
          # before that. So a cancelled run is a run whose teardown starts
          # and is then killed from outside, its record says "signalled,
          # teardown unconfirmed", and a human has to check the account.
          # Nothing here can change that; only not cancelling can.
          #
          # -timeout-seconds is the way to stop a certification safely,
          # because that path is the tool's own and it waits: the ceiling
          # fires, the group gets a SIGTERM, and the trap runs to completion
          # inside the two minutes this line reserves before the job's own
          # ceiling.
          "$RUNNER_TEMP/gauntlet" live-cert \
            -target aws \
            -region "${{ vars.AWS_REGION }}" \
            -ceiling-usd "${{ github.event.inputs.ceiling_usd }}" \
            -timeout-seconds "$(( ${{ github.event.inputs.timeout_minutes }} * 60 - 120 ))" \
            "${{ github.event.inputs.estate }}" | tee live-cert-run.log

      - name: Keep the work dir and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cert-${{ github.event.inputs.estate }}-${{ github.run_id }}
          path: |
            live-cert-run.log
            live/gauntlet/logs/live-cert-${{ github.event.inputs.estate }}.log
            live/gauntlet/logs/live-cert-${{ github.event.inputs.estate }}.run.json
            ${{ runner.temp }}/livecert-work
          if-no-files-found: warn

      - name: Verdict lines for the pull request body
        if: always()
        run: |
          {
            echo "live-cert run for \`${{ github.event.inputs.estate }}\` (run ${{ github.run_id }}, scale=${{ github.event.inputs.scale }}, ceiling_usd=${{ github.event.inputs.ceiling_usd }})."
            echo
            echo "Read these lines, not the job's exit code (HANDOFF.md/worker-common.md: a check that cannot fail is not a check)."
            echo
            echo '```'
            grep '^live-cert ' live-cert-run.log || echo "(no live-cert verdict lines found in the run log - see the uploaded artifact)"
            echo '```'
            echo
            # What state the run reached, read from the record rather than
            # from an exit code (#1324). `rc=143` from a signalled run is
            # indistinguishable from success; this line is not.
            echo "State:"
            echo
            echo '```'
            "$RUNNER_TEMP/gauntlet" live-cert-state "${{ github.event.inputs.estate }}" \
              || echo "(the run did not finish - read the line above before trusting anything else in this pull request)"
            echo '```'
          } > pr-body.md

      # Only the certification artifact and what it renders, never source -
      # the same add-paths shape gauntlet.yml's own PR step uses.
      #
      # The list has to name every file `gauntlet live-cert` writes, which is
      # every file Render writes (tools/gauntlet/render.go) plus the scale
      # artifact. It did not, and the two scale files were the ones missing -
      # the same defect as #1187 one layer out. A scale point produced in the
      # runner and left out of the pull request is discarded exactly as
      # thoroughly as one never published at all, and it is always the newest
      # point, from the run someone went to the most trouble and expense to
      # get. `gauntlet check` / TestRenderedDocsAreCurrent catch the rendered
      # half on the resulting PR; nothing catches a file that was never added.
      - name: Open a pull request with the recorded certification
        id: open_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GAUNTLET_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: live-cert/${{ github.run_id }}
          title: "live-cert: ${{ github.event.inputs.estate }} certification (run ${{ github.run_id }})"
          commit-message: "live-cert: ${{ github.event.inputs.estate }} certification (run ${{ github.run_id }})"
          body-path: pr-body.md
          add-paths: |
            live/gauntlet.json
            live/gauntlet/estates.json
            live/gauntlet-scale.json
            site/data/gauntlet.json
            site/data/gauntlet_board.json
            site/data/gauntlet_scale.json
            live/GAUNTLET.md
          delete-branch: true

      - name: Fail loudly if the certification PR did not open
        # Same reasoning as gauntlet.yml's identical step (issue #496): the
        # run itself, and any real-AWS spend it incurred, happened either
        # way: only landing the evidence on main failed, and that must not
        # be silent.
        if: steps.open_pr.outcome == 'failure'
        run: |
          MSG="live-cert PR did not open for run ${{ github.run_id }}: the certification ran (see the uploaded log/work-dir artifacts) but opening the pull request failed - GAUNTLET_PR_TOKEN unset/expired/mis-scoped, or org policy blocks PR creation (see gauntlet.yml issue #496)"
          echo "::error title=live-cert PR did not open::$MSG"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
