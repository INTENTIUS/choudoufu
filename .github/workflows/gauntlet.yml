name: Gauntlet

# Runs the core estates through every active stage against the pinned
# emulator, nightly and on demand, and opens a pull request with the
# regenerated artifact and docs when anything changed. live/GAUNTLET.md is
# the contract; tools/gauntlet is the runner. The same command runs locally:
#
#   go run ./tools/gauntlet run -set core
#
# The same run also carries the cohort acceptance pass (issue #433): 663
# distinct AWS types for the cost of an apply and a replan per cohort, the
# cheap breadth instrument alongside the gauntlet's deep per-estate one. The
# same command runs locally:
#
#   TF_FLOCI_TEST=1 TF_FLOCI_ACCEPTANCE_ARTIFACT=1 go test ./internal/live/acceptance -run TestCohortAcceptance -v -timeout 6h
#
# Needs Docker (the emulator image), the AWS CLI, a stock terraform binary
# for the cold deploy, and the corpus materialised by tools/corpus-fetch.
#
# Opening the pull request needs a GAUNTLET_PR_TOKEN secret (a fine-grained
# PAT with contents:write and pull-requests:write on this repo): this repo's
# org blocks the built-in GITHUB_TOKEN from creating pull requests at all,
# so without it this step fails every run and the verdicts have to be PRed
# by hand. Falls back to GITHUB_TOKEN if the secret isn't set, which will
# hit that same org restriction.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      set:
        description: "core or all"
        default: "core"
      estates:
        description: "space-separated estate names; overrides set when given"
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gauntlet
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Materialise the corpus
        run: go run ./tools/corpus-fetch
      - name: Build choudoufu
        run: go build -o "$RUNNER_TEMP/choudoufu" ./cmd/choudoufu
      - name: Run the gauntlet
        env:
          TOFU_BIN: ${{ runner.temp }}/choudoufu
        run: |
          set -o pipefail
          if [ -n "${{ github.event.inputs.estates }}" ]; then
            go run ./tools/gauntlet run ${{ github.event.inputs.estates }} | tee gauntlet-run.log || true
          else
            go run ./tools/gauntlet run -set "${{ github.event.inputs.set || 'core' }}" | tee gauntlet-run.log || true
          fi
      - name: Render
        run: go run ./tools/gauntlet render
      - name: Run the cohort acceptance pass
        env:
          TF_FLOCI_TEST: "1"
          TF_FLOCI_ACCEPTANCE_ARTIFACT: "1"
        run: |
          set -o pipefail
          go test ./internal/live/acceptance -run TestCohortAcceptance -v -timeout 60m | tee cohort-acceptance-run.log || true
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-logs
          path: |
            gauntlet-run.log
            live/gauntlet/logs/
            cohort-acceptance-run.log
          if-no-files-found: ignore
      - name: Open a pull request with the new verdicts
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GAUNTLET_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: gauntlet/nightly
          title: "gauntlet: nightly verdicts"
          commit-message: "gauntlet: nightly verdicts"
          body: |
            Regenerated by the Gauntlet workflow. Read the per-estate lines in
            the attached run log, not the exit code; the site bars follow from
            `live/gauntlet.json` once this merges. Also carries the cohort
            acceptance pass (`live/cohort-acceptance.json`, issue #433): read
            the cohort-acceptance-run.log lines the same way, and its
            enforceRatchet failure (if any) means a previously-passing cohort
            regressed, not merely that a still-failing one stayed failing.
          add-paths: |
            live/gauntlet.json
            live/gauntlet/estates.json
            live/GAUNTLET.md
            site/data/gauntlet.json
            site/content/docs/progress/
            live/cohort-acceptance.json
          delete-branch: true
      # The PR changes only the artifact and rendered docs, so
      # automerge-artifact.yml enables auto-merge on it once CI is green.
