name: Gauntlet

# Runs the core estates through every active stage against the pinned
# emulator, nightly and on demand, and opens a pull request with the
# regenerated artifact and docs when anything changed. live/GAUNTLET.md is
# the contract; tools/gauntlet is the runner. The underlying command is the
# one a human would type locally, once per estate:
#
#   go run ./tools/gauntlet run <estate>
#
# and CLAUDE.md's "Heavy and paid runs are the maintainer's, by hand" rule
# makes a whole-set run the maintainer's to start (no agent starts one on
# its own initiative; the mechanical allow-file gate was removed by #1102 on
# 2026-09-14), so this workflow, not a laptop, is the normal way it runs.
# The nightly `schedule` trigger is unaffected (it always was unattended CI,
# never a local session); a manual `workflow_dispatch` run additionally
# waits at the `dispatch-approval` job below for the maintainer's own
# approval on the `corpus` environment before anything starts - see
# HANDOFF.md "Heavy runs are dispatched, approved and never local".
# This workflow's own `workflow_dispatch` (inputs `set`/`estates`) already
# was the dispatch path issue #1032/#807's brief for "the corpus, gated"
# describes, so that gate extends this workflow rather than a separate
# gauntlet-corpus.yml duplicating its steps - see that section of
# HANDOFF.md for why.
#
# ONE ESTATE PER JOB (#1550, second act). The run used to be one job that
# ran every estate in sequence, and it twice measured the whole board and
# published nothing: the corpus leg alone takes over four hours, so the job
# hit its own limit before `Render` and the verdicts pull request ever ran
# (runs 35778888961 and 35819120887, about fifteen hours of CI and two
# approval clicks for an untouched live/gauntlet.json). #1554 raised the
# limit to 420 minutes, which bought time and changed nothing structural.
#
# So the run is sharded instead: `plan` computes the estate list FROM THE
# MANIFEST (`gauntlet estates`, never a hand-written list - the kubernetes
# lane used to be four names typed into a step here), `estate` is a matrix
# job per estate with `fail-fast: false`, and `collect` folds the shards
# back into one artifact with `gauntlet combine-shards` and publishes. The
# wall clock is now the SLOWEST estate rather than their sum, and a leg that
# runs long can no longer take the publish with it.
#
# The cohort acceptance pass (issue #433) moved to a job of its own for the
# same reason: 663 distinct AWS types for the cost of an apply and a replan
# per cohort, and it is independent of every estate, so it runs beside them
# rather than after them. It is what run 35819120887 died inside. The same
# command runs locally:
#
#   TF_FLOCI_TEST=1 TF_FLOCI_ACCEPTANCE_ARTIFACT=1 go test ./internal/live/acceptance -run TestCohortAcceptance -v -timeout 6h
#
# A shard needs Docker (the emulator image), the AWS CLI, a stock terraform
# binary and a real OpenTofu (tofu) binary for the cold deploy - some
# estates are an OpenTofu-native lane (real .tofu-suffixed source) and
# hard-require tofu on PATH with no terraform fallback - and the corpus
# materialised by tools/corpus-fetch.
#
# Opening the pull request wants a GAUNTLET_PR_TOKEN secret: a fine-grained
# PAT whose RESOURCE OWNER is the INTENTIUS organization (not the user
# account), with access to this repository and Contents + Pull requests
# read/write. A token issued under the wrong owner authenticates perfectly
# and is then refused on the branch push - "Permission to
# INTENTIUS/choudoufu.git denied to lex00", HTTP 403 - which is what every
# night from 2026-09-13 to 2026-09-21 did (issue #496, second act).
#
# So the "Check the PR token" step below proves the secret can reach THIS
# repository, and when it cannot, the PR step falls back to GITHUB_TOKEN.
# The org policy that once blocked GITHUB_TOKEN from opening pull requests
# is gone (2026-09-21: can_approve_pull_request_reviews is true at both the
# org and the repo level), so the fallback opens the PR; its cost is issue
# #948 - a PR authored by the Actions app waits for a human to approve its
# CI run. That is one click. The alternative was a measurement computed
# nightly and discarded.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      set:
        description: "core or all"
        default: "core"
      estates:
        description: "space-separated estate names; overrides set when given"
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gauntlet
  cancel-in-progress: false

jobs:
  # Gates a manual dispatch, and only a manual dispatch, behind the `corpus`
  # environment's required reviewer (a repository setting - see HANDOFF.md
  # "Heavy runs are dispatched, approved and never local" for the one-time
  # `gh api` calls that create it). `environment:` pauses the job it is set
  # on at the very first step until a reviewer approves it in the Actions
  # UI, so a trivial one-step job here is enough - the actual heavy work
  # stays entirely in the jobs below, unduplicated.
  #
  # `if:` scopes this to workflow_dispatch so the nightly cron keeps running
  # unattended, exactly as it does today: the maintainer's rule is about a
  # human (or an agent) choosing to start a run right now, not about the
  # existing scheduled cadence.
  dispatch-approval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: corpus
    steps:
      - run: echo "approved by the corpus environment's required reviewer"

  # Which estates does this run measure? Answered once, from the manifest,
  # and handed to both the matrix below and the collect job's expectation,
  # so a name can never be in one and not the other - and so an estate added
  # to live/gauntlet/estates.json cannot silently drop out of the board.
  # `gauntlet estates` is the same selection `gauntlet run` makes, plus the
  # kubernetes lane (tools/gauntlet/shards.go).
  plan:
    needs: [dispatch-approval]
    # always() because `needs` on a job that only conditionally runs
    # (dispatch-approval, above) otherwise makes THIS job skip too on a
    # schedule trigger, where dispatch-approval itself skips. The explicit
    # OR then re-implements the gate: a schedule run needs no approval, a
    # workflow_dispatch run needs dispatch-approval to have actually
    # succeeded (an approved, completed run), not merely to be absent.
    if: always() && (github.event_name != 'workflow_dispatch' || needs.dispatch-approval.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      estates: ${{ steps.list.outputs.json }}
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: List the estates this run measures
        id: list
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.estates }}" ]; then
            JSON=$(go run ./tools/gauntlet estates -json ${{ github.event.inputs.estates }})
          else
            JSON=$(go run ./tools/gauntlet estates -json -set "${{ github.event.inputs.set || 'core' }}")
          fi
          echo "json=$JSON" >> "$GITHUB_OUTPUT"
          echo "names=$(printf '%s' "$JSON" | jq -r 'join(" ")')" >> "$GITHUB_OUTPUT"
          echo "sharding $(printf '%s' "$JSON" | jq -r 'length') estate(s): $(printf '%s' "$JSON" | jq -r 'join(" ")')" >> "$GITHUB_STEP_SUMMARY"

  # One estate, one job. fail-fast: false because a failing estate is a ROW
  # in the artifact, not a broken pipeline (the same reason the run step
  # below ends in `|| true`), and cancelling its siblings would throw away
  # measurements that are already paid for.
  estate:
    needs: [plan]
    # always(): a bare `needs.plan.result == 'success'` has no status check
    # function in it, so GitHub Actions ANDs an implicit success() onto it -
    # and job-level success() looks at the WHOLE transitive graph, not just
    # this job's own `needs`, so it is false whenever anything upstream was
    # skipped, including dispatch-approval, which is *always* skipped on
    # the nightly `schedule` trigger by design (it only gates
    # workflow_dispatch). That silently skipped this job every night
    # (#1563: runs 35975528292, 36115165483, 36230331089 - zero shards ever
    # uploaded, so `collect` had nothing to combine). `plan` and `collect`
    # already carry `always()` for the same reason; this job and
    # `acceptance` below did not.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        estate: ${{ fromJSON(needs.plan.outputs.estates) }}
    # The slowest estate on record is under 35 minutes of script
    # (live/gauntlet.json's last_run.duration_s). This is the bound one
    # level up, generous enough for a cold runner and small enough that a
    # hung script costs one estate rather than the board.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Read the pinned stock oracle versions (issue #544)
        id: oracle
        run: |
          echo "terraform=$(jq -r .terraform_version live/oracle-versions.json)" >> "$GITHUB_OUTPUT"
          echo "tofu=$(jq -r .tofu_version live/oracle-versions.json)" >> "$GITHUB_OUTPUT"
          # The provider pin (#1034) is the third fact in that file, and the
          # provider mirror below is keyed on it.
          echo "aws=$(jq -r .aws_provider_version live/oracle-versions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          # Pinned, not "latest": the stock binary is the ORACLE every stage
          # compares choudoufu's plan against, so an unpinned oracle silently
          # changes what "matches stock" means (issue #544, root cause of
          # #498). live/oracle-versions.json is the single place a human
          # maintains this deliberately; bump it by hand-editing that file,
          # then run `just oracle-bump` to re-measure and get the movement
          # report (tools/oracle-bump-report) before landing it.
          terraform_version: ${{ steps.oracle.outputs.terraform }}
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@v2
        with:
          # Same pin, same file - see the terraform_version comment above.
          # The estates that hard-require tofu only assert a floor
          # (required_version >= 1.11.0, the highest lower bound among them;
          # see live/e2e/corpus-*/run.sh), which live/oracle-versions.json's
          # tofu_version clears. tofu_wrapper: false for the same reason as
          # terraform_wrapper above - the wrapper script would sit between
          # these scripts and the real binary's stdout/stderr/exit code.
          tofu_version: ${{ steps.oracle.outputs.tofu }}
          tofu_wrapper: false
      # The shared provider plugin cache, keyed on the provider pin so a
      # bump of aws_provider_version starts a new entry rather than
      # restoring the old one. Every estate inits the AWS provider, so a hit
      # saves the download in all thirty shards; the warm step below is a
      # stat when it hits and two cold inits when it does not.
      #
      # On the first run after a bump every shard misses and races to save
      # the same key: one wins and the rest log "Unable to reserve cache",
      # which is a warning, not a failure. The entry's exact contents then
      # depend on which shard won (each has installed whatever its own
      # estate needed on top), so read the key as "aws at this pin is in
      # here", which every shard's directory satisfies after the warm step.
      - name: The provider mirror, cached across shards
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: plugin-mirror-${{ runner.os }}-aws-${{ steps.oracle.outputs.aws }}
      - name: Warm the provider mirror (#1550)
        # corpus-simpleinfra-dns consumes the shared cache as a -plugin-dir
        # filesystem MIRROR, which is read-only to the installer, so
        # something else has to fill it. In the old serial run that was an
        # accident of ordering - an earlier estate's ordinary init had
        # already populated the cache. One estate per job removed the
        # accident, and that shard failed at its own stage-0 assertion on an
        # empty runner (run 35896010698). The script reads the version from
        # live/oracle-versions.json and the directory from the crossing
        # library, so nothing here spells either one out.
        #
        # Deliberately NOT exported as TF_PLUGIN_CACHE_DIR for the job:
        # terraform refuses to install a provider from a -plugin-dir that is
        # also its cache ("cannot install existing provider directory to
        # itself"), which is exactly what setting it here would produce.
        run: bash scripts/warm-plugin-cache.sh
      - name: Materialise the corpus
        run: go run ./tools/corpus-fetch
      # The kubernetes lane (issue #1080): its estates run against kind
      # clusters their scripts create, not the emulator. kind and kubectl
      # are pinned the way k8s-smoke.yml pins them, and installed in EVERY
      # shard rather than only the lane's: install_only creates no cluster,
      # costs seconds, and a conditional here would be one more thing that
      # can be wrong about an estate whose lane changed.
      - name: kind and kubectl, pinned (the kubernetes lane)
        uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          kubectl_version: v1.34.0
          install_only: true
      - name: Build choudoufu
        # CGO_ENABLED=0 on purpose (issue #946): with cgo on, the ubuntu
        # runner links the binary against glibc, and corpus-eks-basic execs
        # it inside an alpine toolbox container where no glibc loader exists
        # - the kernel then reports the binary itself as "no such file or
        # directory" and that estate's migrate stage fails on every CI run
        # while passing on every laptop. choudoufu needs no cgo; a static
        # binary runs on the host and in the container alike.
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/choudoufu" ./cmd/choudoufu
      - name: Run the estate
        # `|| true` here is deliberate, not a swallow of an infra failure:
        # `gauntlet run` exits 1 whenever the estate script exits nonzero or
        # an unacknowledged regression is found (tools/gauntlet/main.go), and
        # that happens routinely - a still-failing estate is a row in the
        # artifact, not a broken pipeline. Failing here would drop the
        # upload below, and this shard's measurement with it.
        env:
          TOFU_BIN: ${{ runner.temp }}/choudoufu
        run: |
          set -o pipefail
          go run ./tools/gauntlet run "${{ matrix.estate }}" | tee "gauntlet-run-${{ matrix.estate }}.log" || true
      - name: Name this shard's artifact
        # always(), and a plain copy of whatever live/gauntlet.json says:
        # a shard cancelled before its estate ran uploads the committed row,
        # which carries another run's commit, and `combine-shards` refuses
        # it by name. Uploading nothing would be refused too - the point is
        # that neither case can be mistaken for a measurement.
        if: always()
        run: cp live/gauntlet.json "shard-${{ matrix.estate }}.json"
      - name: Keep this shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-shard-${{ matrix.estate }}
          path: |
            shard-${{ matrix.estate }}.json
            gauntlet-run-${{ matrix.estate }}.log
            live/gauntlet/logs/
          if-no-files-found: ignore

  # The cohort acceptance pass (issue #433), beside the estates rather than
  # after them. It shares nothing with a shard but the emulator image, and
  # it is what run 35819120887 spent the publish's budget inside.
  acceptance:
    needs: [plan]
    # always(): see the identical comment on the estate job above (#1563) -
    # without it, the implicit success() GitHub ANDs onto a bare
    # needs.plan.result comparison fails whenever dispatch-approval (always
    # skipped on the nightly schedule) sits anywhere upstream, and this job
    # was skipped every night as a result.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    # The go test call already carries -timeout 60m; this is the same bound
    # one level up, where a hung binary or a stuck container is also
    # covered. It no longer costs the verdicts if it overruns - collect
    # runs on always() and publishes the board without this artifact.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Read the pinned stock oracle versions (issue #544)
        id: oracle
        run: echo "terraform=$(jq -r .terraform_version live/oracle-versions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          # Stock applies every cohort; the pass then replans it with
          # choudoufu, which internal/live/flocitest builds itself. No tofu
          # and no corpus: this pass reads live/e2e/estates, not .corpus.
          terraform_version: ${{ steps.oracle.outputs.terraform }}
          terraform_wrapper: false
      - name: Run the cohort acceptance pass
        # Same reasoning as "Run the estate" above: enforceRatchet reports
        # a regression with t.Error, not t.Fatal, so the artifact is written
        # even when the test run exits nonzero (main.go's cmdRun comment
        # calls out the same choice) - a still-failing cohort is ground
        # truth to record, not a reason to drop the rest of the job.
        env:
          TF_FLOCI_TEST: "1"
          TF_FLOCI_ACCEPTANCE_ARTIFACT: "1"
        run: |
          set -o pipefail
          go test ./internal/live/acceptance -run TestCohortAcceptance -v -timeout 60m | tee cohort-acceptance-run.log || true
      - name: Keep the acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-acceptance
          path: |
            live/cohort-acceptance.json
            cohort-acceptance-run.log
          if-no-files-found: ignore

  # Fold the shards back into one artifact and publish. Everything from
  # here down is what the single job used to do from `Render` onward.
  collect:
    needs: [plan, estate, acceptance]
    # always(), so a failing estate job (routine) or an acceptance pass that
    # overran (its whole point) still publishes what was measured. `plan`
    # succeeding is the one real precondition: without its list, `collect`
    # cannot tell a missing shard from an estate this run never measured.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Issue #496: is the secret a token this repository accepts a push
      # from? `usable` selects the PR step's token; `reason` is quoted in
      # the PR body and the job summary either way.
      # scripts/gauntlet-pr-token-check.sh is exercised by
      # live/gauntlet_pr_token_test.go against a stubbed gh, so the branch
      # that says "unusable" is proven to fire.
      - name: Check the PR token (issue #496)
        id: prtoken
        env:
          PAT: ${{ secrets.GAUNTLET_PR_TOKEN }}
        run: scripts/gauntlet-pr-token-check.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download the shards
        uses: actions/download-artifact@v4
        with:
          pattern: gauntlet-shard-*
          path: shards
      - name: Combine the shards
        # Refuses rather than guesses: a missing shard (named), a shard from
        # another commit or another emulator pin, a shard carrying a row it
        # did not run. A refusal means re-run THAT estate's job, which is
        # minutes - see tools/gauntlet/shards.go. The aggregates are
        # recomputed by Rebuild, the same call `run` makes, so the headline
        # cannot contradict its own rows.
        run: |
          go run ./tools/gauntlet combine-shards \
            -shards shards \
            -estates "${{ needs.plan.outputs.names }}" \
            -commit "${{ github.sha }}"
      - name: Render
        run: go run ./tools/gauntlet render
      - name: Download the acceptance artifact
        # continue-on-error: an acceptance pass that overran or died leaves
        # live/cohort-acceptance.json as committed, so the PR below simply
        # does not move that file. The board is not held back for it.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gauntlet-acceptance
          path: .
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-logs
          path: |
            shards/
            cohort-acceptance-run.log
            live/gauntlet.json
            live/gauntlet/estates.json
            live/GAUNTLET.md
            site/data/gauntlet.json
            site/data/gauntlet_board.json
            live/cohort-acceptance.json
          if-no-files-found: ignore
      - name: Open a pull request with the new verdicts
        id: open_pr
        # continue-on-error, not a silent `|| true`: this step's own outcome
        # still has to reach the next step so it can fail the job loudly
        # (issue #496 - nine days of nightly verdicts were discarded because
        # this step's failure was the only signal, at the bottom of a log
        # nobody opened). The step's actual work - computing and
        # force-pushing gauntlet/nightly - is unaffected either way.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          # The token the preflight proved, or GITHUB_TOKEN when it proved
          # nothing (see the header comment for what each costs).
          token: ${{ steps.prtoken.outputs.usable == 'true' && secrets.GAUNTLET_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: gauntlet/nightly
          title: "gauntlet: nightly verdicts"
          commit-message: "gauntlet: nightly verdicts"
          body: |
            Regenerated by the Gauntlet workflow, one estate per job. Read the
            per-estate lines in the attached run logs (`shards/` in the
            gauntlet-logs artifact), not the exit code; the site bars follow
            from `live/gauntlet.json` once this merges. Also carries the cohort
            acceptance pass (`live/cohort-acceptance.json`, issue #433): read
            the cohort-acceptance-run.log lines the same way, and its
            enforceRatchet failure (if any) means a previously-passing cohort
            regressed, not merely that a still-failing one stayed failing.

            ${{ steps.prtoken.outputs.usable != 'true' && format('Opened with GITHUB_TOKEN because GAUNTLET_PR_TOKEN was unusable: {0}. A pull request authored by the Actions app waits for a human to approve its CI run (issue #948): `gh run list --branch gauntlet/nightly --workflow CI`, then `gh api -X POST repos/INTENTIUS/choudoufu/actions/runs/<id>/approve`. A fine-grained PAT with resource owner INTENTIUS stops this (issue #496).', steps.prtoken.outputs.reason) || '' }}
          # Every file `gauntlet render` writes (tools/gauntlet/render.go)
          # plus the cohort acceptance artifact the acceptance job writes.
          # TestGauntletWorkflowCarriesEveryFileTheCommandWrites holds this
          # list to Render's output; it named neither board file for eleven
          # days (issue #1310), so a night that moved a verdict opened a PR
          # that was red on the board it left out.
          add-paths: |
            live/gauntlet.json
            live/gauntlet/estates.json
            live/GAUNTLET.md
            site/data/gauntlet.json
            site/data/gauntlet_board.json
            site/data/gauntlet_scale.json
            live/cohort-acceptance.json
          delete-branch: true
      # The PR changes only the artifact and rendered docs, so
      # automerge-artifact.yml enables auto-merge on it once CI is green.
      - name: Fail loudly if the verdicts PR did not open
        # Turns a failure buried in the previous step's log into a one-line
        # annotation at the top of the run, and fails the job (issue #496).
        # The gauntlet ran either way; only landing on main failed. Whether
        # the artifact reached origin/gauntlet/nightly depends on where the
        # step died - a refused push leaves the branch as it was.
        if: steps.open_pr.outcome == 'failure'
        env:
          REASON: ${{ steps.prtoken.outputs.reason }}
        run: |
          MSG="nightly gauntlet: the verdicts PR failed to open, so nothing reached main; see issue #496. PR token check said: $REASON"
          echo "::error title=Nightly verdicts PR did not open::$MSG"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
      - name: Warn when the verdicts PR was opened by the Actions app
        # The fallback path (header comment): the measurement landed in a
        # pull request, and that pull request needs a human's click on its
        # CI run (issue #948) until the secret is reissued (issue #496).
        # A warning and not a failure, because the job did its work - but
        # nightly-watch.yml reads conclusions, so a token left broken shows
        # up here, in the PR body, and in the run summary, not in an issue.
        if: steps.open_pr.outcome == 'success' && steps.prtoken.outputs.usable != 'true'
        env:
          REASON: ${{ steps.prtoken.outputs.reason }}
          PR_URL: ${{ steps.open_pr.outputs.pull-request-url }}
        run: |
          MSG="the verdicts PR ${PR_URL:-(none opened: nothing changed)} was opened with GITHUB_TOKEN because $REASON. Approve its CI run by hand (issue #948) and issue GAUNTLET_PR_TOKEN with resource owner INTENTIUS (issue #496)."
          echo "::warning title=Nightly verdicts PR opened by the Actions app::$MSG"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          fi
