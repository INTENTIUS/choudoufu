# The Kubernetes smokes on a real API server in CI (issue #1080). Every
# Kubernetes proof scenario (k8s-greenfield, k8s-no-silent-orphans and
# k8s-the-label-is-the-boundary, the Kubernetes proofs of claims 7, 1 and
# 13; 24 k8s-custom-resource, 25 k8s-a-held-delete-is-not-gone, 26
# k8s-the-server-gets-the-last-word, 27 k8s-a-label-is-a-change, 39
# k8s-records-in-the-cluster, 46 k8s-a-deleted-namespace-is-gone)
# runs against a kind cluster that
# live/smoke/lib.sh's cluster_up creates per run, each followed by its
# BREAK=1 control, so a regression in the label carrier, the sweep, the
# admission policy template, the honesty of a plan over a terminating
# object or what a run says when admission rewrites what it wrote is
# caught the night after it merges rather than on the maintainer's
# laptop. One job per scenario; each is a few minutes. The
# record-store-cluster job below is not a claim: it applies
# examples/record-store-cluster to a kind cluster and reads its two
# identities back through the authorizer (#1442), and lives here because it
# needs a cluster.
#
# kind and kubectl come from helm/kind-action at a pinned release (the
# versions themselves read from live/kind-version, issue #1594, and
# live/kubectl-version, issue #1741), with
# install_only so the scenario, not the action, owns the cluster's life;
# the scenario's own kind create cluster --image pins the node image from
# live/kind-node-image (Kubernetes 1.30 or later is what
# live/kubernetes/estate-boundary.yaml needs), rather than trusting
# whichever default that kind release happens to ship. live/k8s_ci_test.go
# holds this file to the scenario directory: every k8s-* scenario under
# live/smoke/scenarios must be in the matrix below, with its control.
#
# Claim 27's step 9 needs two substrates at once (#1394): a kind cluster
# for the objects and the pinned floci emulator for the bucket its records
# live in, which is how its label removal is measured for a second working
# directory that shares a bucket rather than the cluster. That means Docker
# (which kind needs anyway) and the AWS CLI, the way
# .github/workflows/bucket-smoke.yml provides them. The preflight step below
# fails the job when either is missing rather than letting the scenario skip
# its own step: a step that quietly does not run reports the same PASS as
# one that did. live/k8s_ci_test.go requires the preflight for as long as
# any k8s-* scenario calls stack_up, and live/bucket_ci_test.go leaves such
# a scenario to this workflow rather than bucket-smoke.yml, which installs
# no cluster.
#
# Bounds and logs (#1457). One job sat in its scenario step for 35 minutes,
# was cancelled by the job timeout and left no log at all. smoke.sh now
# bounds every k8s-* scenario and fails it by name (SMOKE_TIMEOUT_SECS, by
# default twice the claim's claims.json minutes with a ten-minute floor:
# 40 minutes for k8s-records-in-the-cluster, the longest), so
# timeout-minutes below is the backstop. It must sit above the longest
# bound plus a margin for setup, the scenario arm that runs before the
# control, and cleanup, or a stall is cancelled before its named FAIL
# prints; live/smoke_stall_bound_test.go checks that for every scenario in
# every smoke matrix (#1741, which found this job's 40 minutes equal to
# that bound). Each run also
# writes its output to a file as it goes, uploaded whether the job passed,
# failed or was cancelled, so a run that stops still shows where. The
# selftest job proves the bounds against a kubectl that never returns; it
# needs no cluster.
#
# Verdict lines, not exit codes (#1439). Both runs go through
# live/smoke/ci-run.sh, which writes the log as above and then reads it
# back: the step fails unless the log carries the scenario's own
# `PASS: smoke scenario '<name>' - ` line, and the control step fails
# unless a `-> caught` proof line is there too. live/smoke_verdict_test.go
# holds every step that runs a scenario to that wrapper.
#
# The smoke trigger rule (issue #1592, revised 2026-09-29; HANDOFF.md
# "CI: smoke workflow triggers"): no smoke workflow runs on a pull request or
# a push. Each runs nightly and on workflow_dispatch, and is named in
# nightly-watch.yml's workflows list, so a red night opens an issue. To
# prove a branch before merging, dispatch it on that branch.
# live/smoke_trigger_rule_test.go holds this file to that rule.
name: k8s-smoke
on:
  # Nightly and by hand only: no pull_request or push trigger (smoke
  # triggers were taken off pull requests on 2026-09-29, see HANDOFF.md
  # "CI: smoke workflow triggers"). Run one on a branch with
  #   gh workflow run k8s-smoke.yml --ref <branch>
  schedule:
    # Nightly (the rule below), so a repin of the kind or emulator image, or
    # a dependency bump, is caught on the day it happens rather than on the next
    # release.
    - cron: "27 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k8s-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: selftest-bounds, a stalled call fails by name inside its bound
        shell: bash
        run: |
          set -o pipefail
          bash live/smoke/selftest-bounds.sh 2>&1 | tee "$RUNNER_TEMP/selftest-bounds.log"
          # The verdict line, not the exit code: an early `exit 0` before the
          # cases must not read as a pass.
          grep -q -- '^PASS: selftest-bounds' "$RUNNER_TEMP/selftest-bounds.log" || {
            echo "selftest-bounds.sh did not reach its own PASS verdict line in this job."
            exit 1
          }
  # examples/record-store-cluster (issue #1442): the shipped `just up` and
  # `just down` applied to a kind cluster, and the two identities read back
  # with the API server's own authorizer, verb by verb. It is here and not
  # in ci.yml because it needs a cluster. The verdict is the script's own
  # PASS line, read from the log; the control removes one verb from the
  # apply Role and must print "-> caught". live/record_store_cluster_test.go
  # holds this job to the script.
  record-store-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned kind and kubectl versions (issues #1594, #1741)
        id: kind
        run: |
          echo "version=$(cat live/kind-version)" >> "$GITHUB_OUTPUT"
          echo "kubectl=$(cat live/kubectl-version)" >> "$GITHUB_OUTPUT"
      - name: kind and kubectl, pinned
        uses: helm/kind-action@v1.15.0
        with:
          version: ${{ steps.kind.outputs.version }}
          kubectl_version: ${{ steps.kind.outputs.kubectl }}
          install_only: true
      - name: just, which the selftest runs the shipped recipes with
        run: sudo apt-get update -qq && sudo apt-get install -y -qq just
      - name: the selftest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/rsc-logs"
          bash examples/record-store-cluster/selftest.sh 2>&1 | tee "$RUNNER_TEMP/rsc-logs/selftest.log"
          grep -q -- '^PASS: record-store-cluster selftest - ' "$RUNNER_TEMP/rsc-logs/selftest.log" || {
            echo "selftest.sh did not reach its own PASS verdict line in this job."
            exit 1
          }
      - name: the BREAK=1 control
        shell: bash
        env:
          BREAK: "1"
        run: |
          set -o pipefail
          bash examples/record-store-cluster/selftest.sh 2>&1 | tee "$RUNNER_TEMP/rsc-logs/break.log"
          grep -q -- '^  -> caught' "$RUNNER_TEMP/rsc-logs/break.log" || {
            echo "the control never printed its '-> caught' line, so nothing shows the mutant was caught."
            exit 1
          }
          grep -q -- '^PASS: record-store-cluster selftest (BREAK=1) - ' "$RUNNER_TEMP/rsc-logs/break.log" || {
            echo "the control did not reach its own PASS verdict line."
            exit 1
          }
      - name: the selftest logs, whatever happened to the job
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: record-store-cluster-logs
          path: ${{ runner.temp }}/rsc-logs
          if-no-files-found: warn
  smoke:
    runs-on: ubuntu-latest
    # The longest stall bound (40 minutes) plus the 10-minute margin
    # live/smoke_stall_bound_test.go requires. A healthy job takes about 15.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - k8s-greenfield
          - k8s-no-silent-orphans
          - k8s-the-label-is-the-boundary
          - k8s-custom-resource
          - k8s-a-held-delete-is-not-gone
          - k8s-the-server-gets-the-last-word
          - k8s-a-label-is-a-change
          - k8s-records-in-the-cluster
          - k8s-a-deleted-namespace-is-gone
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Read the pinned stock oracle version (issue #544)
        id: oracle
        run: echo "terraform=$(jq -r .terraform_version live/oracle-versions.json)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          # The stock oracle, for the three scenarios that need it: claim
          # 24's migration of a custom resource stock created and recorded
          # in a state file this fork did not write (#1109), claim 27's
          # step 2, which measures what stock proposes for a one-label edit
          # rather than quoting it (#1177), and claim 46's stock twins,
          # whose plans after a namespace delete are the oracle (#1765). Pinned from the same file
          # gauntlet.yml pins it from, for the same reason - an unpinned
          # oracle silently changes what "what stock did" means. The other
          # scenarios never call it.
          terraform_version: ${{ steps.oracle.outputs.terraform }}
          terraform_wrapper: false
      - name: Docker and the AWS CLI, which claim 27's step 9 needs
        run: |
          docker info > /dev/null
          aws --version
      - name: Read the pinned kind and kubectl versions (issues #1594, #1741)
        id: kind
        run: |
          echo "version=$(cat live/kind-version)" >> "$GITHUB_OUTPUT"
          echo "kubectl=$(cat live/kubectl-version)" >> "$GITHUB_OUTPUT"
      - name: kind and kubectl, pinned
        uses: helm/kind-action@v1.15.0
        with:
          version: ${{ steps.kind.outputs.version }}
          kubectl_version: ${{ steps.kind.outputs.kubectl }}
          install_only: true
      # Both runs write to a file that `tail -f` copies into the job log as
      # it grows, and not through `| tee`: a process the scenario orphans
      # (claim 39 SIGKILLs an apply on purpose) holds a file open, which
      # harms nothing, where it would hold a pipe open and keep tee and the
      # step alive after smoke.sh had exited. ci-run.sh does that and then
      # reads the file for the verdict line; the file is what the artifact
      # below uploads.
      - name: the scenario
        shell: bash
        run: bash live/smoke/ci-run.sh ${{ matrix.scenario }} "$RUNNER_TEMP/smoke-logs/scenario.log"
      - name: the BREAK=1 control
        shell: bash
        env:
          BREAK: "1"
        run: bash live/smoke/ci-run.sh ${{ matrix.scenario }} "$RUNNER_TEMP/smoke-logs/break.log"
      # continue-on-error: the log has already streamed into the job log and
      # this artifact is the backup. A backup that cannot be stored must not
      # turn a passed scenario red (#1457, the 403 on run 35660111631).
      - name: the smoke logs, whatever happened to the job
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: k8s-smoke-logs-${{ matrix.scenario }}
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: warn
