name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # gofmt is checked on the fork-owned packages only. A handful of
      # upstream OpenTofu files are gofmt-dirty as inherited, and
      # reformatting them would add permanent merge friction for no gain.
      #
      # The roots must match forkOwnedRoots in live/ci_coverage_test.go.
      # They did not: tools/ and live/ were outside this check while being
      # inside the fork, and two files under tools/ were dirty the whole
      # time - the same narrower-than-the-fork gap #164 found in the test
      # step, one step over.
      - name: gofmt (fork-owned packages)
        run: |
          out="$(gofmt -l internal/live cmd site tools live)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - name: Build
        run: go build ./cmd/choudoufu
      # Every fork-owned package. The glob used to be
      # ./internal/live/... ./tools/survey-gen/, which left eight packages
      # and 36 test files outside CI - including every drift and ratchet
      # test over the generated tables, so a hand edit pointing a
      # resource's identity at a nonexistent argument merged green
      # (issue #164). TestCIRunsEveryForkOwnedTestPackage in ./live keeps
      # this list honest; add a package here, or exclude it by name there.
      - name: Fast test tier
        run: go test ./internal/live/... ./tools/... ./live/ ./cmd/...
      - name: Docs site build
        working-directory: site
        run: go run . -out public/
