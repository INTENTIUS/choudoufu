name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # Full history, not the default depth-1 shallow checkout: the fast
          # test tier below includes TestEveryLastRunCommitIsAnAncestorOfHEAD
          # (tools/gauntlet, issue #511), which needs real ancestry to check
          # every gauntlet row's last_run.commit against HEAD. That guard
          # fails loudly rather than skipping on a shallow checkout - see its
          # doc comment - so this fetch-depth is what keeps it from doing
          # that on every normal CI run. contribute.yml already made this
          # same choice for the same reason.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # gofmt covers the roots this fork wholly owns, plus internal/command,
      # which it does not: that package is upstream's, and the fork has
      # added 21 files inside it. Whole-root thinking left those 21
      # unchecked, and internal/command/live_plan.go was gofmt-dirty on main
      # (issue #171) - the same narrower-than-the-fork gap as #164 and #156,
      # a third time, because the unit of ownership here is the file and
      # every check was written against the directory.
      #
      # The roots must match forkOwnedRoots plus forkOwnedMixedRoots in
      # live/ci_coverage_test.go.
      #
      # Adding a mostly-upstream package to gofmt risks inherited dirt
      # breaking CI, so it was measured first rather than assumed: `gofmt -l`
      # over the whole tree reports zero files outside this list, so no
      # upstream file is being reformatted here and there is no merge
      # friction to trade away. TestNoInheritedFileIsGofmtDirty keeps that
      # true, and says what to do if an upstream sync ever breaks it.
      - name: gofmt (fork-owned files)
        run: |
          out="$(gofmt -l internal/live cmd site tools live internal/command internal/engine/applying internal/tofu)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - name: Build
        run: go build ./cmd/choudoufu
      # Every fork-owned package. The glob used to be
      # ./internal/live/... ./tools/survey-gen/, which left eight packages
      # and 36 test files outside CI - including every drift and ratchet
      # test over the generated tables, so a hand edit pointing a
      # resource's identity at a nonexistent argument merged green
      # (issue #164). TestCIRunsEveryForkOwnedTestPackage in ./live keeps
      # this list honest; add a package here, or exclude it by name there.
      #
      # internal/command is named package by package rather than as
      # ./internal/command/..., because most of its subtree is upstream's.
      # The subpackages listed are the ones holding fork-added files, and
      # the guard recomputes that against the upstream base commit rather
      # than trusting this line - arguments and views had held fork files
      # since 2026-08-12 and were still unrun on 2026-08-30 (issue #591),
      # which is how -parallelism reached arguments/live_import.go with
      # that package's 42 test files never executing.
      #
      # Measured on 2026-08-30: the two add ~5s of CPU and nothing to wall
      # clock (97s before, 94s after - inside the run-to-run noise). The
      # whole subtree instead costs +18s wall and +100s CPU, 44s of it
      # internal/command/e2etest, whose fork-relevant assertions skip
      # without TF_ACC.
      - name: Fast test tier
        run: go test ./internal/live/... ./tools/... ./live/ ./cmd/... ./internal/command/ ./internal/command/arguments/ ./internal/command/views/ ./internal/engine/applying/ ./internal/tofu/...
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Docs site build
        run: |
          cp live/iam-reference.json site/data/iamref.json
          (cd site && hugo --minify --quiet)

  # The generated-terralith estate's own coverage, issue #578's defect 3.
  #
  # tools/terralith-gen writes the synthetic stock-Terraform estate the
  # migration story is told against, and TestValidateGeneratedTerralith is
  # the test that runs `terraform validate` over what it writes. That test
  # sat behind TF_ACC/TF_FLOCI_TEST, which nothing on any ordinary path
  # sets, so it had never executed in an automated run - not once, in its
  # whole life. Its gate is now the terraform binary's presence, and this
  # job is what supplies the binary. Whatever else changes, this must keep
  # running on an ordinary push and pull_request with no special
  # environment; TestCIRunsTheGeneratedTerralithValidation in ./live is the
  # guard that says so.
  #
  # A separate job rather than steps in `fast`, deliberately. It is the one
  # thing in this workflow that talks to the public provider registry, so a
  # registry outage should name itself instead of reddening the fast tier;
  # and running beside `fast` rather than inside it costs a pull request no
  # wall clock.
  validate-generated-terralith:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # terraform_wrapper: false, because the wrapper this action installs by
      # default is a shell script around the real binary, and the tests below
      # read its exit code and its stderr.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # Issue #578's defects 1 and 2. -fmt-bin "" turns OFF the generator's
      # own formatting pass, so this asserts the strong claim: the generator
      # emits canonical HCL by itself, with no formatter binary helping it,
      # at both scales. -check and only -check - `terraform fmt -diff`
      # rewrites the files it reports on, and running it here would make this
      # step pass unconditionally.
      - name: Generated estate is canonical without a formatter binary
        run: |
          set -o pipefail
          go run ./tools/terralith-gen -scale 1 -out "$RUNNER_TEMP/tl1" -fmt-bin ""
          go run ./tools/terralith-gen -scale 4 -out "$RUNNER_TEMP/tl4" -fmt-bin ""
          (cd "$RUNNER_TEMP/tl1" && terraform fmt -check -recursive -no-color .)
          (cd "$RUNNER_TEMP/tl4" && terraform fmt -check -recursive -no-color .)
      - name: terraform validate over the generated estate
        run: |
          set -o pipefail
          go test ./tools/terralith-gen/ -run TestValidateGeneratedTerralith -v 2>&1 | tee "$RUNNER_TEMP/validate.log"
          # A zero exit is not the evidence wanted here: a skipped test also
          # exits zero, and a silent skip is the entire defect this job
          # exists to prevent. Require the pass line by name.
          grep -q -- '--- PASS: TestValidateGeneratedTerralith' "$RUNNER_TEMP/validate.log" || {
            echo "TestValidateGeneratedTerralith did not run to a pass in this job."
            echo "A SKIP here means the terraform binary is missing and the test is invisible again (issue #578, defect 3)."
            exit 1
          }
