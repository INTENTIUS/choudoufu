name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # Full history, not the default depth-1 shallow checkout: the fast
          # test tier below includes TestEveryLastRunCommitIsAnAncestorOfHEAD
          # (tools/gauntlet, issue #511), which needs real ancestry to check
          # every gauntlet row's last_run.commit against HEAD. That guard
          # fails loudly rather than skipping on a shallow checkout - see its
          # doc comment - so this fetch-depth is what keeps it from doing
          # that on every normal CI run. contribute.yml already made this
          # same choice for the same reason.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # TestIdentityGolden and TestIdentityGoldenCohortsAreDeterministic
      # (internal/live/check, issue #930) render the 31 verification
      # cohorts with tools/estate-gen before pinning their identities,
      # which shells out to a literal "terraform" for `init` and `fmt`.
      # flocitest.RequireBinary fails those tests outright rather than
      # skipping when the binary is absent - a green run here over
      # unverified cohort identities is the outcome the golden exists to
      # prevent - so the binary has to actually be on PATH in this job.
      #
      # Pinned via live/oracle-versions.json, the same file gauntlet.yml
      # and contribute.yml read, rather than "latest": issue #544 (root
      # cause of #498) is what an unpinned oracle costs.
      - name: Read the pinned stock oracle version (issue #544)
        id: oracle
        run: echo "terraform=$(jq -r .terraform_version live/oracle-versions.json)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.oracle.outputs.terraform }}
          terraform_wrapper: false
      # gofmt covers the roots this fork wholly owns, plus internal/command,
      # which it does not: that package is upstream's, and the fork has
      # added 21 files inside it. Whole-root thinking left those 21
      # unchecked, and internal/command/live_plan.go was gofmt-dirty on main
      # (issue #171) - the same narrower-than-the-fork gap as #164 and #156,
      # a third time, because the unit of ownership here is the file and
      # every check was written against the directory.
      #
      # The roots must match forkOwnedRoots plus forkOwnedMixedRoots in
      # live/ci_coverage_test.go.
      #
      # Adding a mostly-upstream package to gofmt risks inherited dirt
      # breaking CI, so it was measured first rather than assumed: `gofmt -l`
      # over the whole tree reports zero files outside this list, so no
      # upstream file is being reformatted here and there is no merge
      # friction to trade away. TestNoInheritedFileIsGofmtDirty keeps that
      # true, and says what to do if an upstream sync ever breaks it.
      - name: gofmt (fork-owned files)
        run: |
          out="$(gofmt -l internal/live cmd site tools live internal/backend internal/command internal/configs internal/engine/applying internal/plans internal/plugin internal/plugin6 internal/tofu)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - name: Build
        run: go build ./cmd/choudoufu
      # Every fork-owned package. The glob used to be
      # ./internal/live/... ./tools/survey-gen/, which left eight packages
      # and 36 test files outside CI - including every drift and ratchet
      # test over the generated tables, so a hand edit pointing a
      # resource's identity at a nonexistent argument merged green
      # (issue #164). TestCIRunsEveryForkOwnedTestPackage in ./live keeps
      # this list honest; add a package here, or exclude it by name there.
      #
      # internal/command is named package by package rather than as
      # ./internal/command/..., because most of its subtree is upstream's.
      # The subpackages listed are the ones holding fork-added files, and
      # the guard recomputes that against the upstream base commit rather
      # than trusting this line - arguments and views had held fork files
      # since 2026-08-12 and were still unrun on 2026-08-30 (issue #591),
      # which is how -parallelism reached arguments/live_import.go with
      # that package's 42 test files never executing.
      #
      # Measured on 2026-08-30: the two add ~5s of CPU and nothing to wall
      # clock (97s before, 94s after - inside the run-to-run noise). The
      # whole subtree instead costs +18s wall and +100s CPU, 44s of it
      # internal/command/e2etest, whose fork-relevant assertions skip
      # without TF_ACC.
      #
      # internal/command/e2etest is named on its own, not swept in by the
      # subtree cost above: issue #755 found a fork-authored regression in
      # unlock.go (a stateless guard wired before variable parsing) that this
      # package's TestStaticPlanVariables caught, entirely without TF_ACC -
      # #691's exact shape, a test tier that exists but gates nothing. The
      # package builds its own tofu binary in TestMain via e2e.GoBuild, so no
      # extra setup step is needed here. Measured on 2026-09-05: ~41s wall
      # (66.8s user + 34.7s system CPU) on its own via
      # `env -u PWD go test ./internal/command/e2etest/ -count=1`; maintainer
      # ruling on #755 was to fold it into this tier rather than a nightly one.
      #
      # internal/backend/local, internal/configs, internal/plans,
      # internal/plugin and internal/plugin6 are the same shape, found by
      # #623 running that same recomputation over the whole tree rather
      # than over the roots someone had thought to list. They hold five
      # fork-authored test files that had never executed in any tier, and
      # internal/backend/local holds askPlanGuard - #613's seam, the one
      # thing that stops a stateful plan stripping every marker off a
      # migrated estate. Named package by package for the same reason as
      # internal/command: measured on 2026-08-30, the five packages are
      # 4.7s wall and 6.9s CPU on their own, while their five whole
      # subtrees are 17.4s wall and 40.7s CPU, almost all of it upstream's
      # remote-state backends. In the tier they are below the run-to-run
      # spread - two paired runs on a loaded machine gave 380.3s/381.4s
      # wall before and 368.9s/374.7s after.
      # live/record_store_bucket_test.go runs the shipped `just verify` and
      # `just down` recipes against stub binaries and asserts their exit codes
      # (GitHub issue #1379: the guard it replaced only grepped the justfile,
      # and stayed green with `verify` ignoring the binary and `down` no longer
      # refusing). It fails rather than skips when just is missing, because a
      # guard that skips is permanently green. The runner image does not ship
      # just, so it is installed here, the way contribute.yml does.
      - name: Install just
        run: sudo apt-get update -qq && sudo apt-get install -y -qq just
      # live/record_store_bucket_test.go also BUILDS the bucket project's
      # CloudFormation template with chant and reads DeletionPolicy,
      # UpdateReplacePolicy and the lifecycle rule out of the result (GitHub
      # issue #1382). It reads the built template because the TypeScript can
      # say anything and what CloudFormation receives is the template. It
      # fails rather than skips without node_modules, so they are installed
      # here. This does let a registry outage redden the Go tier, which is
      # why examples/ci-pipelines keeps its own job. The cache is keyed on
      # the lock file so that an ordinary run reaches the registry for
      # nothing, and `npm ci` installs exactly the locked tree.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/record-store-bucket/package-lock.json
      - name: npm ci for the bucket project's template test
        working-directory: examples/record-store-bucket
        run: npm ci
      - name: Fast test tier
        run: go test ./internal/live/... ./tools/... ./live/ ./cmd/... ./internal/command/ ./internal/command/arguments/ ./internal/command/views/ ./internal/command/e2etest/ ./internal/engine/applying/ ./internal/tofu/... ./internal/backend/local/ ./internal/configs/ ./internal/plans/ ./internal/plugin/ ./internal/plugin6/
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Docs site build
        run: |
          cp live/iam-reference.json site/data/iamref.json
          (cd site && hugo --minify --quiet)

  # The generated-terralith estate's own coverage, issue #578's defect 3.
  #
  # tools/terralith-gen writes the synthetic stock-Terraform estate the
  # migration story is told against, and TestValidateGeneratedTerralith is
  # the test that runs `terraform validate` over what it writes. That test
  # sat behind TF_ACC/TF_FLOCI_TEST, which nothing on any ordinary path
  # sets, so it had never executed in an automated run - not once, in its
  # whole life. Its gate is now the terraform binary's presence, and this
  # job is what supplies the binary. Whatever else changes, this must keep
  # running on an ordinary push and pull_request with no special
  # environment; TestCIRunsTheGeneratedTerralithValidation in ./live is the
  # guard that says so.
  #
  # A separate job rather than steps in `fast`, deliberately. It is the one
  # thing in this workflow that talks to the public provider registry, so a
  # registry outage should name itself instead of reddening the fast tier;
  # and running beside `fast` rather than inside it costs a pull request no
  # wall clock.
  validate-generated-terralith:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # terraform_wrapper: false, because the wrapper this action installs by
      # default is a shell script around the real binary, and the tests below
      # read its exit code and its stderr.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # Issue #578's defects 1 and 2. -fmt-bin "" turns OFF the generator's
      # own formatting pass, so this asserts the strong claim: the generator
      # emits canonical HCL by itself, with no formatter binary helping it,
      # at both scales. -check and only -check - `terraform fmt -diff`
      # rewrites the files it reports on, and running it here would make this
      # step pass unconditionally.
      - name: Generated estate is canonical without a formatter binary
        run: |
          set -o pipefail
          go run ./tools/terralith-gen -scale 1 -out "$RUNNER_TEMP/tl1" -fmt-bin ""
          go run ./tools/terralith-gen -scale 4 -out "$RUNNER_TEMP/tl4" -fmt-bin ""
          (cd "$RUNNER_TEMP/tl1" && terraform fmt -check -recursive -no-color .)
          (cd "$RUNNER_TEMP/tl4" && terraform fmt -check -recursive -no-color .)
      - name: terraform validate over the generated estate
        run: |
          set -o pipefail
          go test ./tools/terralith-gen/ -run TestValidateGeneratedTerralith -v 2>&1 | tee "$RUNNER_TEMP/validate.log"
          # A zero exit is not the evidence wanted here: a skipped test also
          # exits zero, and a silent skip is the entire defect this job
          # exists to prevent. Require the pass line by name.
          grep -q -- '--- PASS: TestValidateGeneratedTerralith' "$RUNNER_TEMP/validate.log" || {
            echo "TestValidateGeneratedTerralith did not run to a pass in this job."
            echo "A SKIP here means the terraform binary is missing and the test is invisible again (issue #578, defect 3)."
            exit 1
          }

  # examples/ci-pipelines' byte-for-byte regeneration proof (issue #807) is
  # the example's own `npm test`: it re-runs generate.ts for all three forges
  # into a scratch directory and diffs the result against what is checked in,
  # byte for byte. It needs node and the example's own dependencies, which
  # nothing in this workflow installed, so the proof had only ever run on a
  # laptop (issue #1022) - never in this repository's CI, and never once. The
  # Go tests in live/ci_pipelines_test.go that stand in for it when node is
  # absent (see that file's header) skip for the identical reason.
  #
  # A separate job rather than a step in `fast`, the same call as
  # validate-generated-terralith above: `npm ci` is the only other thing in
  # this workflow that talks to a public package registry, so an npm outage
  # should name itself here instead of reddening the Go tier, and running
  # beside `fast` costs a pull request no wall clock. Measured on the example,
  # issue #1022: `npm ci` ~1s, `npm test` ~4s.
  #
  # Cache keyed on the example's own lock file, not the whole repo's, so a
  # change anywhere else in the tree cannot invalidate it.
  example-ci-pipelines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/ci-pipelines/package-lock.json
      - name: npm ci && npm test
        working-directory: examples/ci-pipelines
        run: |
          npm ci --no-audit --no-fund
          npm test

  # live/live-cert/selftest-kill.sh, issue #1267.
  #
  # #440's stage-1 proof obligation: launch live/live-cert/reference-ec2-vpc.sh
  # against the pinned emulator, wait for stock terraform's own "Creation
  # complete" line so the kill lands while an apply is genuinely in flight,
  # send the harness a real SIGTERM, and check that its trap still ran the
  # teardown. That guards the teardown of the PAID path, where a defect costs
  # money and wall clock rather than a red cell - and until #1267 nothing in
  # this repository ran it.
  #
  # What it proves is narrower than its own PASS line claims: the
  # "independent verification" listing at the end of that script is
  # unreachable on any passing run, because the harness removes the emulator
  # container as teardown's last step. That is issue #1279, found while
  # wiring this job. The trap firing, the exit code, the teardown banner and
  # the container's removal are real and are what this job guards.
  #
  # Here rather than in floci-tier.yml, which is the other workflow with
  # docker: that nightly has failed on every run from 2026-09-12 to
  # 2026-09-17, every gated test failing at 0.00s on "terraform is required by
  # this test but is not on PATH", because it never installs the binary.
  # Adding a guard to an already-red job reproduces the exact problem #1267 is
  # about. live/livecert_selftests_test.go's TestCIRunsTheKillSelftest is the
  # guard on this job.
  #
  # A separate job rather than a step in `fast`, the same call as the two
  # jobs above: it is the only thing in this workflow that pulls a container
  # image, so a registry outage names itself here instead of reddening the Go
  # tier. Measured 2026-09-17 on a laptop with the image cached and the binary
  # prebuilt: 19s end to end.
  livecert-selftest-kill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned from live/oracle-versions.json, the same read the fast job
      # makes for the same reason (issue #544): the harness's trusted
      # teardown shells out to a literal `terraform destroy`, and an
      # unpinned oracle is what #498 cost.
      - name: Read the pinned stock oracle version (issue #544)
        id: oracle
        run: echo "terraform=$(jq -r .terraform_version live/oracle-versions.json)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.oracle.outputs.terraform }}
          terraform_wrapper: false
      # TOFU_BIN, so reference-ec2-vpc.sh skips its own `go build`. The
      # driver synchronizes its kill against the apply's own progress, not
      # against wall clock, so a cold build would not break it - but it
      # would put a multi-minute build inside this job's bound for no
      # reason.
      - name: Build the binary the harness runs
        run: go build -o "$RUNNER_TEMP/choudoufu" ./cmd/choudoufu
      - name: selftest-kill against the pinned emulator
        env:
          TOFU_BIN: ${{ runner.temp }}/choudoufu
        run: |
          set -o pipefail
          timeout 1200 bash live/live-cert/selftest-kill.sh 2>&1 | tee "$RUNNER_TEMP/kill.log"
          # A zero exit is not the evidence wanted here, the same call the
          # validate-generated-terralith job makes: require the script's own
          # verdict line by name, so a future early `exit 0` before the
          # assertions cannot read as a pass.
          grep -q -- '=== selftest-kill: PASS' "$RUNNER_TEMP/kill.log" || {
            echo "selftest-kill.sh did not reach its own PASS verdict line in this job."
            echo "Read the log above: the script prints one line per property it confirmed and a FAIL line per one it did not."
            exit 1
          }
