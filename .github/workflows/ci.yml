name: CI

on:
  push:
    branches: [main]
  pull_request:
  # workflow_dispatch lets a run be started by hand. Every ordinary change
  # still runs on push and pull_request (TestCIValidationRunsOnOrdinaryEvents).
  workflow_dispatch:
  # release.yml calls this workflow so a tag is gated on the same unit tier.
  workflow_call:

permissions:
  contents: read

# Unit tests only on pull_request, push and release: gofmt, build and the Go
# unit test tier. example-ci-pipelines is not a unit test, so it runs only on
# workflow_dispatch (it is skipped, not removed, so its guard test still holds).
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # Full history, not the default depth-1 shallow checkout: the fast
          # test tier below includes TestEveryLastRunCommitIsAnAncestorOfHEAD
          # (tools/gauntlet, issue #511), which needs real ancestry to check
          # every gauntlet row's last_run.commit against HEAD. That guard
          # fails loudly rather than skipping on a shallow checkout - see its
          # doc comment - so this fetch-depth is what keeps it from doing
          # that on every normal CI run.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # TestIdentityGolden and TestIdentityGoldenCohortsAreDeterministic
      # (internal/live/check, issue #930) render the 31 verification
      # cohorts with tools/estate-gen before pinning their identities,
      # which shells out to a literal "terraform" for `init` and `fmt`.
      # flocitest.RequireBinary fails those tests outright rather than
      # skipping when the binary is absent - a green run here over
      # unverified cohort identities is the outcome the golden exists to
      # prevent - so the binary has to actually be on PATH in this job.
      # tools/estate-gen's TestDeterminism (choudoufu#2300) uses the same
      # binary the same way.
      #
      # Pinned via live/oracle-versions.json, the same file the gauntlet
      # tool reads, rather than "latest": issue #544 (root cause of #498) is
      # what an unpinned oracle costs.
      - name: Read the pinned stock oracle version (issue #544)
        id: oracle
        run: echo "terraform=$(jq -r .terraform_version live/oracle-versions.json)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.oracle.outputs.terraform }}
          terraform_wrapper: false
      # gofmt covers the roots this fork wholly owns, plus internal/command,
      # which it does not: that package is upstream's, and the fork has
      # added 21 files inside it. Whole-root thinking left those 21
      # unchecked, and internal/command/live_plan.go was gofmt-dirty on main
      # (issue #171) - the same narrower-than-the-fork gap as #164 and #156,
      # a third time, because the unit of ownership here is the file and
      # every check was written against the directory.
      #
      # The roots must match forkOwnedRoots plus forkOwnedMixedRoots in
      # live/ci_coverage_test.go.
      #
      # Adding a mostly-upstream package to gofmt risks inherited dirt
      # breaking CI, so it was measured first rather than assumed: `gofmt -l`
      # over the whole tree reports zero files outside this list, so no
      # upstream file is being reformatted here and there is no merge
      # friction to trade away. TestNoInheritedFileIsGofmtDirty keeps that
      # true, and says what to do if an upstream sync ever breaks it.
      - name: gofmt (fork-owned files)
        run: |
          out="$(gofmt -l internal/live pkg cmd tools live internal/backend internal/builtin/providers/tf internal/command internal/configs internal/e2e internal/engine/applying internal/plans internal/plugin internal/plugin6 internal/plugins internal/states/statemgr internal/tofu internal/tracing)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - name: Build
        run: go build ./cmd/choudoufu
      # Every fork-owned package. The glob used to be
      # ./internal/live/... ./tools/survey-gen/, which left eight packages
      # and 36 test files outside CI - including every drift and ratchet
      # test over the generated tables, so a hand edit pointing a
      # resource's identity at a nonexistent argument merged green
      # (issue #164). TestCIRunsEveryForkOwnedTestPackage in ./live keeps
      # this list honest; add a package here, or exclude it by name there.
      #
      # internal/command is named package by package rather than as
      # ./internal/command/..., because most of its subtree is upstream's.
      # The subpackages listed are the ones holding fork-added files, and
      # the guard recomputes that against the upstream base commit rather
      # than trusting this line - arguments and views had held fork files
      # since 2026-08-12 and were still unrun on 2026-08-30 (issue #591),
      # which is how -parallelism reached arguments/live_import.go with
      # that package's 42 test files never executing.
      #
      # Measured on 2026-08-30: the two add ~5s of CPU and nothing to wall
      # clock (97s before, 94s after - inside the run-to-run noise). The
      # whole subtree instead costs +18s wall and +100s CPU, 44s of it
      # internal/command/e2etest, whose fork-relevant assertions skip
      # without TF_ACC.
      #
      # internal/command/e2etest is named on its own, not swept in by the
      # subtree cost above: issue #755 found a fork-authored regression in
      # unlock.go (a live-mode guard wired before variable parsing) that this
      # package's TestStaticPlanVariables caught, entirely without TF_ACC -
      # #691's exact shape, a test tier that exists but gates nothing. The
      # package builds its own tofu binary in TestMain via e2e.GoBuild, so no
      # extra setup step is needed here. Measured on 2026-09-05: ~41s wall
      # (66.8s user + 34.7s system CPU) on its own via
      # `env -u PWD go test ./internal/command/e2etest/ -count=1`; maintainer
      # ruling on #755 was to fold it into this tier rather than a nightly one.
      #
      # internal/backend/local, internal/configs, internal/plans,
      # internal/plugin and internal/plugin6 are the same shape, found by
      # #623 running that same recomputation over the whole tree rather
      # than over the roots someone had thought to list. They hold five
      # fork-authored test files that had never executed in any tier, and
      # internal/backend/local holds askPlanGuard - #613's seam, the one
      # thing that stops a stateful plan stripping every marker off a
      # migrated estate. Named package by package for the same reason as
      # internal/command: measured on 2026-08-30, the five packages are
      # 4.7s wall and 6.9s CPU on their own, while their five whole
      # subtrees are 17.4s wall and 40.7s CPU, almost all of it upstream's
      # remote-state backends. In the tier they are below the run-to-run
      # spread - two paired runs on a loaded machine gave 380.3s/381.4s
      # wall before and 368.9s/374.7s after.
      # live/record_store_bucket_test.go runs the shipped `just verify` and
      # `just down` recipes against stub binaries and asserts their exit codes
      # (GitHub issue #1379: the guard it replaced only grepped the justfile,
      # and stayed green with `verify` ignoring the binary and `down` no longer
      # refusing). It fails rather than skips when just is missing, because a
      # guard that skips is permanently green. The runner image does not ship
      # just, so it is installed here.
      - name: Install just
        run: sudo apt-get update -qq && sudo apt-get install -y -qq just
      # live/record_store_bucket_test.go also BUILDS the bucket project's
      # CloudFormation template with chant and reads DeletionPolicy,
      # UpdateReplacePolicy and the lifecycle rule out of the result (GitHub
      # issue #1382). It reads the built template because the TypeScript can
      # say anything and what CloudFormation receives is the template. It
      # fails rather than skips without node_modules, so they are installed
      # here. This does let a registry outage redden the Go tier, which is
      # why examples/ci-pipelines keeps its own job. The cache is keyed on
      # the lock file so that an ordinary run reaches the registry for
      # nothing, and `npm ci` installs exactly the locked tree.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/record-store-bucket/package-lock.json
      - name: npm ci for the bucket project's template test
        working-directory: examples/record-store-bucket
        run: npm ci
      - name: Prose lint README.md
        run: npm ci --no-audit --no-fund && node prose-lint.mjs -fail README.md
      - name: Fast test tier
        run: go test ./internal/live/... ./pkg/... ./tools/... ./live/ ./cmd/... ./internal/command/ ./internal/command/arguments/ ./internal/command/views/ ./internal/command/e2etest/ ./internal/engine/applying/ ./internal/tofu/... ./internal/backend/local/ ./internal/backend/remote-state/azure/auth/ ./internal/configs/ ./internal/plans/ ./internal/plans/planfile/ ./internal/plugin/ ./internal/plugin6/ ./internal/plugins/ ./internal/states/statemgr/ ./internal/tracing/... ./internal/builtin/providers/tf/

  # examples/ci-pipelines' byte-for-byte regeneration proof (issue #807, #1022)
  # is the example's own `npm test`: it re-runs generate.ts for all three
  # forges into a scratch directory and diffs the result against what is
  # checked in. Manual only, so pull requests, pushes and releases skip it.
  # Cache is keyed on the example's own lock file.
  example-ci-pipelines:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/ci-pipelines/package-lock.json
      - name: npm ci && npm test
        working-directory: examples/ci-pipelines
        run: |
          npm ci --no-audit --no-fund
          npm test
