name: site-next

# Builds the Astro + Starlight site in site-next/ on every pull request and
# push, so it cannot rot before it replaces the Hugo site (#2092). It never
# deploys: pages.yml keeps deploying the Hugo site from site/ until cutover.
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build site-next
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site-next
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site-next/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
