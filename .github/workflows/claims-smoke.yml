# The AWS claim proofs on the pinned floci emulator (issue #1590, part of
# #1579; regrouped by #1817).
#
# Every AWS proof in live/smoke/claims.json that runs on the emulator, and
# that bucket-smoke.yml does not already run, is a matrix entry here: one
# job per scenario, with its BREAK=1 control. #1817 folded the claims into
# 16 promises without deleting proofs, so an entry is a scenario, not a
# claim number; the scenario's header names the claim it proves. Real-AWS
# proofs (real_service) stay maintainer-run (CLAUDE.md), Kubernetes proofs
# run in k8s-smoke.yml, and the record-store bucket proofs run in
# bucket-smoke.yml. live/claims_smoke_ci_test.go derives the list from
# claims.json and holds both matrices to it.
#
# #1817 removed two entries: recovery-is-a-rerun, whose lost-files step
# moved into a-killed-apply-hides-nothing, and plan-cost-tracks-the-estate,
# whose steps plan-cost-under-foreign-load runs with the scale as a
# parameter.
#
# Budget: 10 minutes per scenario, both arms combined (2026-09-26 ruling
# on #1590: "same rule as the kubernetes lane"); scenarios over it run in
# smoke-nightly. The budget was set by measuring every candidate locally
# against the pinned emulator, both arms, not from claims.json's minutes,
# which is a CI-timeout input (smoke.sh's scenario_bound_secs doubles it)
# rather than a runtime estimate. The slowest entry in `smoke` measured
# 5m26s combined (carve-by-retag); no-secret-survives-in-what-the-tool-keeps
# measured 15m39s and runs in smoke-nightly.
#
# The provider plugin cache (PR #1646's first CI run). Three of 23 jobs
# came back red the first time this workflow ran for real: carve-by-retag
# and roundtrip both failed a host-side `chdf init` with no output (its
# stderr goes to /dev/null by design; live/smoke/scenarios/*.sh), and
# no-self-managed-locks died under set -e with no verdict line at all.
# Locally, against the same emulator, all 23 passed - so the difference is
# the runner, not the scenario logic, for two of the three: `chdf` resolves
# hashicorp/aws from registry.opentofu.org on every `chdf init` (see
# live/oracle-versions.json's own comment on the two-registry split), and
# with 20 scenario jobs starting at once - more concurrent cold fetches
# than bucket-smoke.yml's 5 or k8s-smoke.yml's 8 ever produce - a registry
# fetch that would ordinarily succeed is more likely to be the one that
# times out. Unlike gauntlet.yml's shared mirror (#1550), nothing here uses
# a resolved provider directory as a read-only -plugin-dir, so
# TF_PLUGIN_CACHE_DIR is safe to export directly: `chdf init` already
# honours it (verified locally - a scenario run with it set populated
# registry.opentofu.org/hashicorp/aws/<version> under the cache dir), so a
# job with several scenario-internal inits (carve-by-retag has three) only
# ever fetches once, and actions/cache carries a warm cache from one run
# into the next so a cold fetch is the exception rather than the rule for
# all 20 jobs at once. No provider version is pinned in the key - `chdf`
# resolves whatever a scenario's own versions.tf allows, not
# aws_provider_version (that field pins the STOCK oracle side of a
# gauntlet crossing estate, a different thing) - so the cache just
# accumulates whatever gets fetched.
#
# The third failure, no-self-managed-locks, was a real scenario bug, not
# an environment difference: its race step captured a losing apply's exit
# code as `cmd; echo $? > file`, and under this script's inherited set -e
# a nonzero exit from `cmd` aborts the subshell before `echo` ever runs -
# which happens exactly when the race has an actual loser, an expected,
# routine outcome the very next lines are written to handle. Fixed in the
# scenario itself (`|| rc=$?` neutralises set -e without discarding the
# code), verified with three back-to-back local runs that each hit the
# loser branch and each still passed.
#
# a-held-delete-is-not-gone and the-server-gets-the-last-word (#1599) prove
# the part of their promise the emulator can produce, and each proof's note
# in claims.json says which part; since #1817 they are proofs of claims 1
# and 15.
#
# Verdict lines, not exit codes (#1439). Every run goes through
# live/smoke/ci-run.sh, which writes the run's output to a file as it goes
# and then reads it back: the step fails unless the log carries the
# scenario's own `PASS: smoke scenario '<name>' - ` line, and a control
# step fails unless a `-> caught` proof line is there too. The logs are
# uploaded whether the job passed or failed. live/smoke_verdict_test.go
# holds every step that runs a scenario to the wrapper.
#
# The smoke trigger rule (issue #1592, revised 2026-09-29; HANDOFF.md
# "CI: smoke workflow triggers"): no smoke workflow runs on a pull request or
# a push. Each runs nightly and on workflow_dispatch, and is named in
# nightly-watch.yml's workflows list, so a red night opens an issue. To
# prove a branch before merging, dispatch it on that branch.
# live/smoke_trigger_rule_test.go holds this file to that rule.
name: claims-smoke
on:
  # Nightly and by hand only: no pull_request or push trigger (smoke
  # triggers were taken off pull requests on 2026-09-29, see HANDOFF.md
  # "CI: smoke workflow triggers"). Run one on a branch with
  #   gh workflow run claims-smoke.yml --ref <branch>
  schedule:
    # Nightly: both jobs, so a repin of the emulator image or of a
    # dependency is caught on the day it happens.
    - cron: "12 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: claims-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    # Nightly and on dispatch, beside smoke-nightly below. Until 2026-09-29
    # this ran on every pull request and was skipped on the schedule, so once
    # it came off pull requests it had to join the nightly or run nowhere.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - no-silent-orphans
          - no-self-managed-locks
          - staleness-costs-reads
          - roundtrip
          - identity-is-a-tag
          - stock-when-you-need-it
          - unchanged-is-free
          - cache-serves-the-whole-estate
          - count-is-a-fungible-set
          - carve-by-retag
          - apply-what-was-approved
          - the-boundary-holds-across-regions
          - a-shadow-is-not-a-claimant
          - the-boundary-holds-across-accounts
          - plan-cost-under-foreign-load
          - the-estate-answers-in-the-present-tense
          - a-killed-apply-hides-nothing
          - two-estates-at-once
          - an-ignored-tag-is-not-drift
          - the-tag-is-the-boundary
          - a-held-delete-is-not-gone
          - the-server-gets-the-last-word
          - record-only-survives-cache-loss
    env:
      # Safe here (unlike gauntlet.yml's shared mirror, #1550): nothing in
      # these scenarios reads this directory as a read-only -plugin-dir, so
      # `chdf init` treats it as an ordinary, writable cache. It is also the
      # stock oracle's cache, mounted at this same path (live/smoke/lib.sh):
      # with the oracle on its own /plugins volume, roundtrip and
      # stock-when-you-need-it each found the other side's symlink dangling
      # in their shared .terraform/providers (run 36339857046).
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The provider plugin cache, carried across runs
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: claims-smoke-tf-plugin-cache-${{ runner.os }}
          restore-keys: |
            claims-smoke-tf-plugin-cache-${{ runner.os }}
      - name: Docker and the AWS CLI, which every scenario here needs
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          docker info > /dev/null
          aws --version
      - name: the scenario
        shell: bash
        run: bash live/smoke/ci-run.sh ${{ matrix.scenario }} "$RUNNER_TEMP/smoke-logs/scenario.log"
      - name: the BREAK=1 control
        shell: bash
        env:
          BREAK: "1"
        run: bash live/smoke/ci-run.sh ${{ matrix.scenario }} "$RUNNER_TEMP/smoke-logs/break.log"
      # continue-on-error: the log has already streamed into the job log and
      # this artifact is the backup. A backup that cannot be stored must not
      # turn a passed scenario red (#1457, the 403 on run 35660111631).
      - name: the smoke logs, whatever happened to the job
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: claims-smoke-logs-${{ matrix.scenario }}
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: warn
  smoke-nightly:
    # Nightly and on dispatch, like smoke above; kept as its own job for its
    # own budget.
    #
    # Measured at 9m21s + 6m18s = 15m39s combined, well over the 10-minute
    # budget above; every other proven AWS cell measured under it and runs
    # in the smoke job instead.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - no-secret-survives-in-what-the-tool-keeps
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The provider plugin cache, carried across runs
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: claims-smoke-tf-plugin-cache-${{ runner.os }}
          restore-keys: |
            claims-smoke-tf-plugin-cache-${{ runner.os }}
      - name: Docker and the AWS CLI, which every scenario here needs
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          docker info > /dev/null
          aws --version
      - name: the scenario
        shell: bash
        run: bash live/smoke/ci-run.sh ${{ matrix.scenario }} "$RUNNER_TEMP/smoke-logs/scenario.log"
      - name: the BREAK=1 control
        shell: bash
        env:
          BREAK: "1"
        run: bash live/smoke/ci-run.sh ${{ matrix.scenario }} "$RUNNER_TEMP/smoke-logs/break.log"
      - name: the smoke logs, whatever happened to the job
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: claims-smoke-logs-${{ matrix.scenario }}
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: warn
