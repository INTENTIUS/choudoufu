# reference-k8s-helm-cert-manager's deltas from cert-manager v1.21.2's chart
# defaults (#1981). Every other value is the chart's own.
#
# run.sh's stages edit three places in this file by exact match:
# the Certificate's revisionHistoryLimit (plan_approval), cainjector's
# enabled (day2_remove), and everything after the shard marker at the end
# of extraObjects (day2_count). Keep their spelling, and keep extraObjects
# the last key.

# The six CRDs are templates behind this toggle, off by default because a
# Helm user is expected to install them separately. On, they render the
# same six CRDs the install bundle carries, and the custom resources below
# need them.
crds:
  enabled: true

# A post-install hook Job (helm.sh/hook: post-install, with its
# ServiceAccount, Role and RoleBinding, four hook documents in all) that
# polls the API until the webhook admits a dry-run Certificate. Without
# Helm nothing runs hooks in order or deletes them afterwards, and the
# Job's own pod would be a fifth workload to wait on; run.sh's
# webhook_admits probe does the same check, bounded, from outside.
startupapicheck:
  enabled: false

# The chart default, written out because day2_remove turns it off: seven
# objects leave the render, a Deployment, a ServiceAccount, a Service, a
# ClusterRole and its binding, and a Role and RoleBinding in kube-system.
cainjector:
  enabled: true

# The estate's own custom resources, through the chart's extraObjects
# (rendered with tpl, emitted as documents of their own) rather than as
# hand-written blocks: the same three reference-k8s-cert-manager writes in
# custom-resources.tf, from cert-manager's self-signed documentation. A
# ClusterIssuer and an Issuer sharing one name across a cluster-scoped and
# a namespaced kind, and a Certificate whose controller creates a Secret
# nothing declares. Each names its namespace, since tpl output is not
# namespaced by the chart. revisionHistoryLimit is declared at its
# documented default of 1, so plan_approval's edit is one spec-side scalar
# that triggers no reissue.
extraObjects:
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: selfsigned
    spec:
      selfSigned: {}
  - |
    apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata:
      name: selfsigned
      namespace: cert-manager
    spec:
      selfSigned: {}
  - |
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: example-com
      namespace: cert-manager
    spec:
      secretName: example-com-tls
      commonName: example.com
      dnsNames:
        - example.com
      revisionHistoryLimit: 1
      issuerRef:
        name: selfsigned
        kind: Issuer
        group: cert-manager.io
  # day2_count's shards: run.sh's set_shards rewrites everything from this line to the end of the file.
