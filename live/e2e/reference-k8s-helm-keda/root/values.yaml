# reference-k8s-helm-keda's deltas from keda 2.21.0's defaults (#1983). Every other
# value is the chart's own: in particular certificates.autoGenerated stays
# true, so the operator mints its own CA and serving certificate at runtime
# (the kedaorg-certs Secret, which nothing here declares) and patches the
# caBundle into the APIService and the ValidatingWebhookConfiguration this
# estate does declare. The chart has no helm hooks and no cert-gen Job, so
# there is nothing to switch off for a client-side render.
#
# run.sh's stages edit three places in this file by exact match - the
# webhooks' timeoutSeconds line, metricsServer's enabled line, and
# everything after the day2_count marker at the end of extraObjects - so
# keep their spelling.

# The chart writes `cpu: 1` as a YAML integer; the API server stores a
# quantity and reads it back as the string "1", and kubernetes_manifest
# would see a number planned and a string applied. The same limits and
# requests as the chart's defaults, with the integer quoted.
resources:
  operator:
    limits:
      cpu: "1"
      memory: 1000Mi
    requests:
      cpu: 100m
      memory: 100Mi
  metricServer:
    limits:
      cpu: "1"
      memory: 1000Mi
    requests:
      cpu: 100m
      memory: 100Mi
  webhooks:
    limits:
      cpu: "1"
      memory: 1000Mi
    requests:
      cpu: 100m
      memory: 100Mi

webhooks:
  # The chart's own default, spelled out so plan_approval has one scalar
  # whose change re-renders exactly one object: the keda-admission
  # ValidatingWebhookConfiguration, all six of its webhooks.
  timeoutSeconds: 10

# day2_remove turns this off: eight rendered objects over seven kinds - the
# metrics apiserver's Deployment, Service and ServiceAccount, a ClusterRole,
# two ClusterRoleBindings, a RoleBinding in kube-system and the cluster-wide
# APIService v1beta1.external.metrics.k8s.io - and no other object of the
# render changes.
metricsServer:
  enabled: true

# The estate's own workload and its autoscaler, rendered by the chart's
# extraObjects through tpl, so they come out of the same render as
# everything else and a day-2 count change is a values list edit.
#
# choudoufu-base is a pause Deployment with no replicas field: KEDA's
# operator creates the HorizontalPodAutoscaler keda-hpa-choudoufu-base from
# the ScaledObject, owned by it, and that HPA owns the Deployment's replica
# count through the scale subresource. Declaring replicas would make two
# writers of one field.
#
# The ScaledObject's cron trigger is active for one minute a year (00:00 to
# 00:01 UTC on 1 January), so the HPA holds the Deployment at
# minReplicaCount and nothing scales during a run. The operator labels every
# ScaledObject scaledobject.keda.sh/name=<its own name> (its
# ensureScaledObjectLabel) unless the label is already there with that
# value; it is declared here at that value, so what is stored is what is
# declared. No field of the spec has a CRD default (the one the CRD has is
# under fallback, unused).
extraObjects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: choudoufu-base
      namespace: keda
    spec:
      selector:
        matchLabels:
          app: choudoufu-base
      template:
        metadata:
          labels:
            app: choudoufu-base
        spec:
          containers:
            - name: pause
              image: registry.k8s.io/pause:3.10
  - apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    metadata:
      name: choudoufu-base
      namespace: keda
      labels:
        scaledobject.keda.sh/name: choudoufu-base
    spec:
      scaleTargetRef:
        name: choudoufu-base
      minReplicaCount: 1
      maxReplicaCount: 2
      triggers:
        - type: cron
          metadata:
            timezone: Etc/UTC
            start: 0 0 1 1 *
            end: 1 0 1 1 *
            desiredReplicas: "2"
  # day2_count shards: run.sh rewrites from this line to the end of the file.
