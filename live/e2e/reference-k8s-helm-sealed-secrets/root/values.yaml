# reference-k8s-helm-sealed-secrets's deltas from sealed-secrets 2.20.0's
# defaults. Every other value is the chart's own.
#
# run.sh's stages edit three places in this file by exact match - the
# metrics Service's port, serviceProxier's create, and everything after the
# "day2_count's shards" comment at the end - so keep their spelling.

# kubeseal's default --controller-name, so the objects carry the names a
# sealed-secrets user expects instead of rel-sealed-secrets. The namespace
# is helm_template's (sealed-secrets), not the docs' kube-system: the chart
# reads .Release.Namespace when `namespace` is empty.
fullnameOverride: sealed-secrets-controller

# Six templates write `annotations:` unconditionally and fill it only from
# commonAnnotations; with nothing under it the key decodes to null and
# kubernetes_manifest replans for ever ("known after apply"). One fixture
# annotation fills all six, and the two Services and the ServiceAccount
# carry it too.
commonAnnotations:
  example.com/fixture: reference-k8s-helm-sealed-secrets

# The Deployment writes `env:` unconditionally and fills it only with
# GOMAXPROCS and GOMEMLIMIT from the container's cpu and memory limits;
# the chart has no other env value. Limits put both entries under it, and
# replace the chart's `limits: {}` and `requests: {}`.
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

rbac:
  serviceProxier:
    create: true

metrics:
  service:
    port: 8081

# SealedSecrets, through the chart's own extraDeploy, so the render carries
# custom resources of the chart's CRD (and cold deploy needs the declared
# pre-apply). Their ciphertext is deliberately NOT sealed to this
# controller: a real one is encrypted to the RSA key the controller
# generates at start-up, which differs on every cluster this script makes,
# so no committed value can hold it. The API admits the object (the CRD
# only requires spec.encryptedData, a map of strings) and the controller
# records Synced=False in status - a SealedSecret copied in from another
# cluster. The values are base64 of plain words, not secrets.
extraDeploy:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: sealed-elsewhere
      namespace: "{{ .Release.Namespace }}"
    spec:
      encryptedData:
        password: c2VhbGVkIGZvciBhbm90aGVyIGNsdXN0ZXI=
  # day2_count's shards: run.sh replaces everything after this line.
