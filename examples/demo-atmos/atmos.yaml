# Atmos as shipped, with choudoufu as the Terraform binary. `command` and the
# components' `live` blocks are the only choudoufu-specific things in the repo.
# Workspaces stay on, init passes -reconfigure (its default), and Atmos writes
# backend.tf.json from the stack. The workflow in .forgejo/workflows runs the
# Atmos CLI; nothing here knows about a pipeline tool.
base_path: "./"

components:
  terraform:
    base_path: "components/terraform"
    # Atmos runs this executable wherever it would run terraform or tofu.
    command: choudoufu
    # Atmos writes backend.tf.json from the stack's backend section.
    auto_generate_backend_file: true
    # Atmos's planfile store: `plan --ci` keeps each component's plan, and
    # `deploy --ci` applies only what matches it. A plan that held a value
    # known after apply (a new subnet's id) cannot compare equal once the
    # value is known, so verify warns and choudoufu's own check refuses a
    # plan that moved; required makes a missing stored plan stop the deploy.
    planfiles:
      verify: warn
      required: true
      default: demo
      stores:
        demo:
          type: aws/s3
          options:
            bucket: demo-atmos-choudoufu-state
            prefix: planfiles/
            region: us-east-1

stacks:
  base_path: "stacks"
  included_paths:
    - "deploy/**/*"
  name_template: "{{ .vars.stage }}"

ci:
  enabled: true

logs:
  file: "/dev/stderr"
  level: Info
