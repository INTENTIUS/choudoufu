# Stock Atmos CI. A pull request runs `atmos terraform plan --affected
# --include-dependents --ci`: one plan across the components the change
# reaches, each component's plan kept in Atmos's planfile store (atmos.yaml,
# components.terraform.planfiles). A merge runs `atmos terraform deploy
# --affected --include-dependents --ci`, which takes each component's stored
# plan, plans again and applies only what matches it. The component command is
# choudoufu (atmos.yaml).
name: atmos-choudoufu-demo

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  ATMOS_TELEMETRY_ENABLED: 'false'
  NO_COLOR: '1'
  TF_IN_AUTOMATION: '1'
  # Installs hashicorp/aws from the image's mirror, so no job downloads it.
  TF_CLI_CONFIG_FILE: /etc/demo/tofu-mirror.tfrc
  AWS_ENDPOINT_URL: http://floci:4566
  # choudoufu's record store addresses its bucket virtual-hosted; demo-records
  # forwards those requests to floci path-style (the demo host's compose file).
  AWS_ENDPOINT_URL_S3: http://demo-records:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  # Where behold reads the run's report and index row (the same bucket and
  # prefix as the other demos). chant-report is chant's `terraform report`.
  CHANT_REPORTS: http://floci:4566/demo-reports/demo
  # The report document of the reviewed plan, kept for the merge's report.
  # Atmos's planfile store (atmos.yaml) is in the same bucket, addressed
  # virtual-hosted through demo-records like choudoufu's record store.
  REVIEWED_REPORTS: http://floci:4566/demo-atmos-choudoufu-state/reviewed-plans
  FORGEJO_ACTIONS: "true"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: docker
    container: demo-choudoufu:local
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          # --affected compares against origin/main, so the history is needed.
          fetch-depth: 0
      - name: One plan across the components the change reaches
        run: |
          set -o pipefail
          atmos terraform plan --affected --include-dependents --ref refs/remotes/origin/main --ci 2>&1 | tee plan.txt
      - name: Write the plan's report for behold
        env:
          PR: '${{ github.event.pull_request.number }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
        run: |
          # The report reads one document for the run; composed-plan.mjs joins the components' slices of the joint plan.
          node .forgejo/composed-plan.mjs network app edge > "$RUNNER_TEMP/plan.json"
          # The job image has node and no curl.
          node -e '
            const body = require("fs").readFileSync(process.argv[1]);
            fetch(process.argv[2], { method: "PUT", body }).then((r) => { if (!r.ok) { console.error("keeping the reviewed report failed", r.status); process.exit(1); } });
          ' "$RUNNER_TEMP/plan.json" "$REVIEWED_REPORTS/$HEAD_SHA.json"
          chant-report --stage tf-plan --plan "$RUNNER_TEMP/plan.json" --pull-request "$PR" \
            --binary choudoufu --root-dir components/terraform --to "$CHANT_REPORTS"
      - name: Post the plan on the pull request
        if: always()
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          API: '${{ github.server_url }}/api/v1/repos/${{ github.repository }}'
        run: |
          node -e '
            const fs = require("fs");
            const plan = fs.existsSync("plan.txt") ? fs.readFileSync("plan.txt", "utf8").slice(-60000) : "no plan output";
            const body = "<!-- atmos-choudoufu-plan -->\n`atmos terraform plan --affected --include-dependents`, with choudoufu as the component command:\n\n```\n" + plan + "\n```\n";
            fetch(process.env.API + "/issues/" + process.env.PR_NUMBER + "/comments", {
              method: "POST",
              headers: { authorization: "token " + process.env.GITHUB_TOKEN, "content-type": "application/json" },
              body: JSON.stringify({ body }),
            }).then((r) => { if (!r.ok) { console.error("comment failed", r.status); process.exit(1); } });
          '
  apply:
    if: github.event_name == 'push'
    runs-on: docker
    container: demo-choudoufu:local
    concurrency:
      group: atmos-choudoufu-apply
      cancel-in-progress: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a reviewer's approval of the merged pull request
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          SHA: '${{ github.sha }}'
          API: '${{ github.server_url }}/api/v1/repos/${{ github.repository }}'
        run: |
          node -e '
            const h = { authorization: "token " + process.env.GITHUB_TOKEN };
            const get = async (p) => { const r = await fetch(process.env.API + p, { headers: h }); if (!r.ok) throw new Error(p + " " + r.status); return r.json(); };
            (async () => {
              const pr = await get("/commits/" + process.env.SHA + "/pull");
              const reviews = await get("/pulls/" + pr.number + "/reviews");
              const ok = reviews.some((r) => r.state === "APPROVED" && !r.dismissed && r.user.login !== pr.user.login);
              if (!ok) { console.error("pull request " + pr.number + " has no approving review from someone other than its author"); process.exit(1); }
              console.log("pull request " + pr.number + " was approved by a reviewer");
              require("fs").appendFileSync(process.env.GITHUB_ENV, "HEAD_SHA=" + pr.head.sha + "\n");
            })().catch((e) => { console.error(e.message); process.exit(1); });
          '
      # Atmos keys a stored plan by the commit that planned it, the pull
      # request's head. The deploy runs on that commit, and only when the merge
      # commit holds the same tree, so the reviewed files are the merged files.
      - name: Check out the reviewed commit
        env:
          MERGED: '${{ github.sha }}'
        run: |
          git checkout -q "$HEAD_SHA"
          git diff --quiet "$HEAD_SHA" "$MERGED" \
            || { echo "the merged tree is not the reviewed tree of $HEAD_SHA; plan the pull request again" >&2; exit 1; }
          node -e '
            fetch(process.argv[1]).then(async (r) => {
              if (!r.ok) { console.error("no reviewed report at " + process.argv[1], r.status); process.exit(1); }
              require("fs").writeFileSync(process.argv[2], Buffer.from(await r.arrayBuffer()));
            });
          ' "$REVIEWED_REPORTS/$HEAD_SHA.json" "$RUNNER_TEMP/plan.json"
      - name: Deploy the reviewed plan to network, app and edge
        run: |
          # deploy takes each component's stored plan, plans again and applies.
          # A value known after apply in the stored plan is known by now, which
          # Atmos reports as drift under verify: warn; choudoufu then refuses
          # (exit status 3) any difference from the stored plan beyond such values.
          atmos terraform deploy --affected --include-dependents --sha '${{ github.event.before }}' --ci
      - name: Write the apply's report for behold
        run: |
          # A plan made after the apply: its prior_state holds the values the first plan left unknown.
          atmos terraform plan --affected --include-dependents --sha '${{ github.event.before }}' >/dev/null
          node .forgejo/composed-plan.mjs network app edge > "$RUNNER_TEMP/after.json"
          chant-report --stage tf-apply --plan "$RUNNER_TEMP/plan.json" --applied "$RUNNER_TEMP/after.json" \
            --binary choudoufu --root-dir components/terraform --to "$CHANT_REPORTS"
