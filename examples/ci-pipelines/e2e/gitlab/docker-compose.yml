# Throwaway GitLab CE + gitlab-runner + floci, for running the generated
# gitlab/scheduled-ops.gitlab-ci.yml against a real instance (#1026 item 3).
#
# Modelled on gitlab-warden's e2e/docker-compose.yml. Two differences, both
# forced by the fact that jobs run inside containers rather than on the host:
#
#   * external_url is http://gitlab:8929, not http://localhost:8929. Every
#     CI_* URL GitLab hands a job is derived from external_url, so with
#     `localhost` the clone, the API and the notes endpoint all resolve to
#     the job container itself. `gitlab` is the compose network alias, which
#     resolves from the runner's job containers and from the emulator alike.
#     The host still reaches the same instance on http://localhost:8929 -
#     GitLab serves any Host header - which is what bootstrap.sh uses.
#   * the network is named, so gitlab-runner can put the containers it spawns
#     on it (network_mode in config.toml). Without that the job containers
#     land on the default bridge and can reach neither GitLab nor floci.
#
# `docker compose down -v` removes all state.
name: choudoufu-gitlab-e2e

services:
  gitlab:
    image: gitlab/gitlab-ce:17.11.0-ce.0
    container_name: choudoufu-gitlab-e2e
    shm_size: "256m"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab:8929'
        gitlab_rails['initial_root_password'] = 'Zx9QvK3mNt8RpLb2WdHf'
        gitlab_rails['monitoring_whitelist'] = ['0.0.0.0/0']
        gitlab_rails['rack_attack_git_basic_auth'] = {}
        prometheus_monitoring['enable'] = false
        puma['worker_processes'] = 0
        sidekiq['max_concurrency'] = 3
        gitlab_rails['gitlab_default_can_create_group'] = true
    ports:
      - "8929:8929"
    networks:
      e2e:
        aliases: [gitlab]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8929/-/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  # The AWS emulator the Ops plan and apply against. 4572 on the host so it
  # does not collide with an emulator another harness already has on 4570.
  floci:
    image: ghcr.io/lex00/floci@sha256:d9207de14c919f4bfa50e956376cc441970f3679aabfdd43f3dbf4b779b20805
    container_name: choudoufu-gitlab-e2e-floci
    ports:
      - "4572:4566"
    networks:
      e2e:
        aliases: [floci]

  # Registered by bootstrap.sh, which needs the project id first, so this
  # service starts with no config and is (re)started after registration.
  runner:
    image: gitlab/gitlab-runner:v17.11.0
    container_name: choudoufu-gitlab-e2e-runner
    depends_on: [gitlab]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-config:/etc/gitlab-runner
    networks:
      e2e:
        aliases: [runner]

volumes:
  runner-config:

networks:
  e2e:
    name: choudoufu-gitlab-e2e
