on:
  push:
    branches:
      - staging

env:
  CHANT_FORGE: forgejo
  AWS_REGION: '${{ vars.AWS_REGION }}'
  TF_VAR_aws_region: '${{ vars.AWS_REGION }}'

concurrency:
  group: live-adopt
  cancel-in-progress: false

jobs:
  live-adopt:
    runs-on: docker
    container: node:22
