# Regenerate with: CHANT_FORGE=forgejo npm run generate
# The Op this job runs is examples/ci-pipelines/src/live-adopt.op.ts.

on:
  push:
    branches:
      - staging

env:
  CHANT_FORGE: forgejo
  AWS_REGION: '${{ vars.AWS_REGION }}'
  TF_VAR_aws_region: '${{ vars.AWS_REGION }}'
  AWS_ACCESS_KEY_ID: '${{ secrets.AWS_ACCESS_KEY_ID }}'
  AWS_SECRET_ACCESS_KEY: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'

concurrency:
  group: live-adopt
  cancel-in-progress: false

jobs:
  live-adopt:
    runs-on: docker
    container: node:22
    outputs:
      gated: '${{ steps.chant-run.outputs.gated }}'
      op: '${{ steps.chant-run.outputs.op }}'
      gate: '${{ steps.chant-run.outputs.gate }}'
      approve: '${{ steps.chant-run.outputs.approve }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: curl -fsSL -o /tmp/choudoufu_v0.15.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.15.0/choudoufu_v0.15.0_linux_amd64.tar.gz && echo "c5a40433bd159c1bb2596fbd8005ee4886f144a150f96c7219ac1e23298c50d3  /tmp/choudoufu_v0.15.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.15.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
      - id: chant-run
        run: |
          set -o pipefail
          json="${RUNNER_TEMP:-/tmp}/chant-run-live-adopt.json"
          npx chant run live-adopt --gated-exit 0 --json | tee "$json"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.status!=="gated"||!process.env.GITHUB_OUTPUT)process.exit(0);fs.appendFileSync(process.env.GITHUB_OUTPUT,`gated=true\nop=${r.op}\ngate=${(r.gate&&r.gate.name)||""}\napprove=${r.approve||""}\n`)' "$json"
        env:
          GITHUB_TOKEN: '${{ github.token }}'
