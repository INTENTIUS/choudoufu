# live-apply.yml - generated by examples/ci-pipelines/generate.ts. DO NOT EDIT.
# Regenerate with: CHANT_FORGE=forgejo npm run generate
# The Op this job runs is examples/ci-pipelines/src/live-apply.op.ts.

# chant dropped `environment: production` from this workflow: Forgejo Actions has no
# environments, so there is no protection rule, required reviewer or wait timer for the key to
# name. This job is not held back by anything on the forge. What still stops the apply is chant's
# own gate: the run records a pending fact on the chant/lifecycle branch and ends, and `chant
# approve <op> <gate>` is what lets the next run through.

on:
  push:
    branches:
      - main

env:
  CHANT_FORGE: forgejo
  AWS_REGION: '${{ vars.AWS_REGION }}'
  TF_VAR_aws_region: '${{ vars.AWS_REGION }}'
  AWS_ACCESS_KEY_ID: '${{ secrets.AWS_ACCESS_KEY_ID }}'
  AWS_SECRET_ACCESS_KEY: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'

concurrency:
  group: live-apply
  cancel-in-progress: false

jobs:
  live-apply:
    runs-on: docker
    container: node:22
    outputs:
      gated: '${{ steps.chant-run.outputs.gated }}'
      op: '${{ steps.chant-run.outputs.op }}'
      gate: '${{ steps.chant-run.outputs.gate }}'
      approve: '${{ steps.chant-run.outputs.approve }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: curl -fsSL -o /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.16.0/choudoufu_v0.16.0_linux_amd64.tar.gz && echo "1e9d540893c6f30fad47530614cf0b1935672e991167a175aca940ebe7b3c7ae  /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
      - id: chant-run
        run: |
          set -o pipefail
          json="${RUNNER_TEMP:-/tmp}/chant-run-live-apply.json"
          npx chant run live-apply --gated-exit 0 --json | tee "$json"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.status!=="gated"||!process.env.GITHUB_OUTPUT)process.exit(0);fs.appendFileSync(process.env.GITHUB_OUTPUT,`gated=true\nop=${r.op}\ngate=${(r.gate&&r.gate.name)||""}\napprove=${r.approve||""}\n`)' "$json"
        env:
          GITHUB_TOKEN: '${{ github.token }}'
