# Regenerate with: CHANT_FORGE=forgejo npm run generate
# The Op this job runs is examples/ci-pipelines/src/live-plan.op.ts.

on:
  pull_request:
    branches:
      - main

env:
  CHANT_FORGE: forgejo
  AWS_REGION: '${{ vars.AWS_REGION }}'
  TF_VAR_aws_region: '${{ vars.AWS_REGION }}'
  AWS_ACCESS_KEY_ID: '${{ secrets.AWS_ACCESS_KEY_ID }}'
  AWS_SECRET_ACCESS_KEY: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'

concurrency:
  group: live-plan
  cancel-in-progress: false

jobs:
  live-plan:
    runs-on: docker
    container: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: curl -fsSL -o /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.16.0/choudoufu_v0.16.0_linux_amd64.tar.gz && echo "1e9d540893c6f30fad47530614cf0b1935672e991167a175aca940ebe7b3c7ae  /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
      - run: npx chant run live-plan
        env:
          GITHUB_TOKEN: '${{ github.token }}'
