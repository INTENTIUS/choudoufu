# Regenerate with: CHANT_FORGE=forgejo npm run generate
# The Op this job runs is examples/ci-pipelines/src/live-check.op.ts.

on:
  pull_request:
    branches:
      - main

env:
  CHANT_FORGE: forgejo
  AWS_REGION: '${{ vars.AWS_REGION }}'
  TF_VAR_aws_region: '${{ vars.AWS_REGION }}'

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: docker
    container: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: curl -fsSL -o /tmp/choudoufu_v0.32.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.32.0/choudoufu_v0.32.0_linux_amd64.tar.gz && echo "54bc4b2a06ada387478c7fa2db108eaec0343cd1bd833ff9f1adf3847ccd514a  /tmp/choudoufu_v0.32.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.32.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
      - run: npx chant run live-check
        env:
          GITHUB_TOKEN: '${{ github.token }}'
