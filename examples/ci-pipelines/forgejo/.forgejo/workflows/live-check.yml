# live-check.yml - generated by examples/ci-pipelines/generate.ts. DO NOT EDIT.
# Regenerate with: CHANT_FORGE=forgejo npm run generate
# The Op this job runs is examples/ci-pipelines/src/live-check.op.ts.

on:
  pull_request:
    branches:
      - main

env:
  CHANT_FORGE: forgejo
  AWS_REGION: '${{ vars.AWS_REGION }}'
  TF_VAR_aws_region: '${{ vars.AWS_REGION }}'
  AWS_ACCESS_KEY_ID: '${{ secrets.AWS_ACCESS_KEY_ID }}'
  AWS_SECRET_ACCESS_KEY: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: docker
    container: node:22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: curl -fsSL -o /tmp/choudoufu_v0.15.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.15.0/choudoufu_v0.15.0_linux_amd64.tar.gz && echo "c5a40433bd159c1bb2596fbd8005ee4886f144a150f96c7219ac1e23298c50d3  /tmp/choudoufu_v0.15.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.15.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
      - run: npx chant run live-check
        env:
          GITHUB_TOKEN: '${{ github.token }}'
