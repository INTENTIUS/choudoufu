# live-adopt.yml - generated by examples/ci-pipelines/generate.ts. DO NOT EDIT.
# Regenerate with: CHANT_FORGE=github npm run generate
# The Op this job runs is examples/ci-pipelines/src/live-adopt.op.ts.

on:
  push:
    branches:
      - staging

env:
  CHANT_FORGE: github
  AWS_REGION: '${{ vars.AWS_REGION }}'
  TF_VAR_aws_region: '${{ vars.AWS_REGION }}'

concurrency:
  group: live-adopt
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  live-adopt:
    runs-on: ubuntu-latest
    container: node:22
    outputs:
      gated: '${{ steps.chant-run.outputs.gated }}'
      op: '${{ steps.chant-run.outputs.op }}'
      gate: '${{ steps.chant-run.outputs.gate }}'
      approve: '${{ steps.chant-run.outputs.approve }}'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: '${{ vars.CHOUDOUFU_ADOPT_ROLE_ARN }}'
          aws-region: '${{ vars.AWS_REGION }}'
      - run: npm ci --no-audit --no-fund
      - run: curl -fsSL -o /tmp/choudoufu_v0.17.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.17.0/choudoufu_v0.17.0_linux_amd64.tar.gz && echo "f12d2975474b103be6f0f29a3dae6e81bbc876e70b5b95b49cc444ffbacb1fa5  /tmp/choudoufu_v0.17.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.17.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
      - id: chant-run
        run: |
          set -o pipefail
          json="${RUNNER_TEMP:-/tmp}/chant-run-live-adopt.json"
          npx chant run live-adopt --gated-exit 0 --json | tee "$json"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.status!=="gated"||!process.env.GITHUB_OUTPUT)process.exit(0);fs.appendFileSync(process.env.GITHUB_OUTPUT,`gated=true\nop=${r.op}\ngate=${(r.gate&&r.gate.name)||""}\napprove=${r.approve||""}\n`)' "$json"
        shell: bash
        env:
          GITHUB_TOKEN: '${{ github.token }}'
  live-adopt-gate-notice:
    needs: live-adopt
    if: needs.live-adopt.outputs.gated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Report the pending gate
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
          CHANT_OP: '${{ needs.live-adopt.outputs.op }}'
          CHANT_GATE: '${{ needs.live-adopt.outputs.gate }}'
          CHANT_APPROVE: '${{ needs.live-adopt.outputs.approve }}'
        run: |
          api_base="${GITHUB_API_URL%/}"
          api_base="${api_base:-https://api.github.com}"
          marker="<!-- chant-gate:$CHANT_OP -->"
          body=$(printf '%s\n\nThe `%s` apply for %s stopped at gate `%s` and is waiting for an approval. Nothing was applied.\n\n```\n%s --approver <you>\n```\n\nThe pending fact is on `_gates/%s.jsonl` on the `chant/lifecycle` branch. Approving is a commit: push it and this workflow runs again and applies.\n' "$marker" "$CHANT_OP" "$GITHUB_SHA" "$CHANT_GATE" "$CHANT_APPROVE" "$CHANT_OP")
          pr=$(gh api "$api_base/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq ".[0].number // empty")
          if [ -z "$pr" ]; then
            gh issue create --title "$CHANT_OP is waiting on gate $CHANT_GATE" --body "$body"
            exit 0
          fi
          id=$(gh api "$api_base/repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty" | grep -m1 -E "^[0-9]+$" || true)
          if [ -n "$id" ]; then
            gh api --method PATCH "$api_base/repos/$GITHUB_REPOSITORY/issues/comments/$id" -f "body=$body" --jq .html_url
          else
            gh api --method POST "$api_base/repos/$GITHUB_REPOSITORY/issues/$pr/comments" -f "body=$body" --jq .html_url
          fi
