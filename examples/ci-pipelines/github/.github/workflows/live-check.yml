on:
  pull_request:
    branches:
      - main

env:
  CHANT_FORGE: github
  AWS_REGION: '${{ vars.AWS_REGION }}'
  TF_VAR_aws_region: '${{ vars.AWS_REGION }}'

concurrency:
  group: live-check
  cancel-in-progress: false

