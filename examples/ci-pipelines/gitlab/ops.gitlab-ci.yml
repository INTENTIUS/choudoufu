# ops.gitlab-ci.yml - generated by examples/ci-pipelines/generate.ts. DO NOT EDIT.
# Regenerate with: CHANT_FORGE=gitlab npm run generate
# Each job below runs the Op its own name is: examples/ci-pipelines/src/<job>.op.ts.

# chant Ops (#927, #2084, #2293) — one job per Op under stage "ops", each
# selected by its own rules:. A merge_request_event or push job needs no
# setup; its rule fires on the event itself.
#
# GitLab has no in-file cron. Create one Pipeline Schedule per cron Op
# below (Settings > CI/CD > Schedules): set its cron to the value noted
# here and its CHANT_SCHEDULED_OP CI/CD variable to the Op's name, so only
# that job runs on that schedule.
#
#   live-check: merge_request_event onto main, finding-mode report
#   live-plan: merge_request_event onto main, finding-mode comment — needs a GITLAB_TOKEN CI/CD variable (masked, scope: api)
#   live-adopt: push to staging, finding-mode report — a gated apply stays green, its pending gate in the log and in chant-gate-live-adopt.md
#   live-apply: push to main, finding-mode report — a gated apply stays green, its pending gate in the log and in chant-gate-live-apply.md
#     deploys to environment "production" — protect it under Settings > CI/CD > Protected environments to require an approval before the job runs
#   live-discover: cron "0 6 * * *", CHANT_SCHEDULED_OP="live-discover", finding-mode issue — needs a GITLAB_TOKEN CI/CD variable (masked, scope: api)

stages:
  - ops

variables:
  CHANT_FORGE: gitlab
  TF_VAR_aws_region: '$AWS_REGION'

live-check:
  stage: ops
  image: node:22
  resource_group: live-check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  script:
    - npm ci --no-audit --no-fund
    - curl -fsSL -o /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.16.0/choudoufu_v0.16.0_linux_amd64.tar.gz && echo "1e9d540893c6f30fad47530614cf0b1935672e991167a175aca940ebe7b3c7ae  /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
    - npx chant run live-check

live-plan:
  stage: ops
  image: node:22
  resource_group: live-plan
  id_tokens:
    CHANT_ID_TOKEN:
      aud: '$CI_SERVER_URL'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  script:
    - echo "$CHANT_ID_TOKEN" > "$CI_PROJECT_DIR/.chant-id-token.jwt" && export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_PROJECT_DIR/.chant-id-token.jwt" && export AWS_ROLE_ARN="$CHOUDOUFU_PLAN_ROLE_ARN" && export AWS_ROLE_SESSION_NAME="gitlab-ci-$CI_PIPELINE_ID"
    - npm ci --no-audit --no-fund
    - curl -fsSL -o /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.16.0/choudoufu_v0.16.0_linux_amd64.tar.gz && echo "1e9d540893c6f30fad47530614cf0b1935672e991167a175aca940ebe7b3c7ae  /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
    - npx chant run live-plan

live-adopt:
  stage: ops
  image: node:22
  resource_group: live-adopt
  id_tokens:
    CHANT_ID_TOKEN:
      aud: '$CI_SERVER_URL'
  variables:
    CHANT_GATE_SUMMARY: chant-gate-live-adopt.md
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "staging"'
  script:
    - echo "$CHANT_ID_TOKEN" > "$CI_PROJECT_DIR/.chant-id-token.jwt" && export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_PROJECT_DIR/.chant-id-token.jwt" && export AWS_ROLE_ARN="$CHOUDOUFU_ADOPT_ROLE_ARN" && export AWS_ROLE_SESSION_NAME="gitlab-ci-$CI_PIPELINE_ID"
    - npm ci --no-audit --no-fund
    - curl -fsSL -o /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.16.0/choudoufu_v0.16.0_linux_amd64.tar.gz && echo "1e9d540893c6f30fad47530614cf0b1935672e991167a175aca940ebe7b3c7ae  /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
    - npx chant run live-adopt --gated-exit 0
  artifacts:
    when: always
    paths:
      - chant-gate-live-adopt.md
    expire_in: '30 days'

live-apply:
  stage: ops
  image: node:22
  resource_group: live-apply
  id_tokens:
    CHANT_ID_TOKEN:
      aud: '$CI_SERVER_URL'
  environment:
    name: production
  variables:
    CHANT_GATE_SUMMARY: chant-gate-live-apply.md
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - echo "$CHANT_ID_TOKEN" > "$CI_PROJECT_DIR/.chant-id-token.jwt" && export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_PROJECT_DIR/.chant-id-token.jwt" && export AWS_ROLE_ARN="$CHOUDOUFU_APPLY_ROLE_ARN" && export AWS_ROLE_SESSION_NAME="gitlab-ci-$CI_PIPELINE_ID"
    - npm ci --no-audit --no-fund
    - curl -fsSL -o /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.16.0/choudoufu_v0.16.0_linux_amd64.tar.gz && echo "1e9d540893c6f30fad47530614cf0b1935672e991167a175aca940ebe7b3c7ae  /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
    - npx chant run live-apply --gated-exit 0
  artifacts:
    when: always
    paths:
      - chant-gate-live-apply.md
    expire_in: '30 days'

live-discover:
  stage: ops
  image: node:22
  resource_group: live-discover
  id_tokens:
    CHANT_ID_TOKEN:
      aud: '$CI_SERVER_URL'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CHANT_SCHEDULED_OP == "live-discover"'
  script:
    - echo "$CHANT_ID_TOKEN" > "$CI_PROJECT_DIR/.chant-id-token.jwt" && export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_PROJECT_DIR/.chant-id-token.jwt" && export AWS_ROLE_ARN="$CHOUDOUFU_PLAN_ROLE_ARN" && export AWS_ROLE_SESSION_NAME="gitlab-ci-$CI_PIPELINE_ID"
    - npm ci --no-audit --no-fund
    - curl -fsSL -o /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.16.0/choudoufu_v0.16.0_linux_amd64.tar.gz && echo "1e9d540893c6f30fad47530614cf0b1935672e991167a175aca940ebe7b3c7ae  /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.16.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
    - npx chant run live-discover
