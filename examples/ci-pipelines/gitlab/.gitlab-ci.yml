# The GitLab half of this example: one job, `live-discover`, on a project-level
# Pipeline Schedule. Hand-written, and this file is the one thing in
# examples/ci-pipelines that is not emitted by `generate.ts` beside it.
#
# WHY IT IS HAND-WRITTEN
#
# chant has a gitlab Op generator (lexicons/gitlab/src/components/
# generate-op-pipeline.ts), and it is cron-only. Handed this project's five
# Ops it refuses four of them by name, before any YAML exists:
#
#   live-check, live-plan  ->  Scheduled Op "live-check" has a "pull_request"
#     trigger, but GitLab has no pull_request/push event model (#2084) - only
#     a project-level Pipeline Schedule (cron).
#   live-adopt, live-apply ->  the same refusal for their "push" trigger.
#   live-plan again        ->  Scheduled Op "live-plan" has findingMode
#     "comment", which posts its finding on the pull request that triggered
#     the run. GitLab has no pull_request event and chant has no GitLab
#     merge-request note activity (#2231).
#
# and two of the per-Op options the other forges use, for the same reason
# GitLab has no `permissions:` block here at all (#2242): a `setup` step
# spelled `uses:` is a GitHub Actions marketplace action and GitLab CI runs
# `script` lines only, and an additive `permissions` map has no per-job
# token-scope mapping to add to - GitLab's OIDC surface is a separate
# `id_tokens:` declaration the job exchanges itself, which chant does not
# generate.
#
# So the fifth Op, `live-discover`, is the only one that survives the
# crossing, and the job below is the shape chant's generator emits for it -
# one `stages`, one selector rule, one `chant run` - with the install line and
# the credentials this project needs added. Generating one job of five out of
# a project whose other four throw would put a file here that `npm run
# generate` cannot reproduce; the currency guards therefore treat this file as
# tracked and hand-written (examples/ci-pipelines/tests/currency.test.ts and
# live/ci_pipelines_test.go), and assert it never grows a generated banner.
#
# WHAT TO SET UP
#
# GitLab has no in-file cron. Create one Pipeline Schedule (Settings > CI/CD >
# Schedules) for this job:
#
#   Description:  live-discover
#   Interval:     0 6 * * *          # the cron src/live-discover.op.ts declares
#   Variables:    CHANT_SCHEDULED_OP = live-discover
#
# The rule below runs the job only for a scheduled pipeline carrying that
# variable, so a schedule with a different selector runs nothing here and a
# push or merge-request pipeline produces no job from this file at all. A
# project that already has a `.gitlab-ci.yml` keeps its own jobs and adds
# this one.
#
# AWS CREDENTIALS: STATIC, AND UNVERIFIED FOR OIDC
#
# Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as masked, protected project
# CI/CD variables (Settings > CI/CD > Variables) on a role that only needs to
# read: `live-discover` sweeps the tagging API and reads the adoption ledger,
# and writes no marker and no resource. They are not repeated under
# `variables:` below because a GitLab CI/CD variable is already in every job's
# environment - unlike the GitHub Actions dialect, where the generator's
# `variables` become the workflow's top-level `env:` and a `${{ secrets.X }}`
# reference is how a secret reaches the job. The scoping dial on GitLab is the
# variable's own protection and environment scope, not this file.
#
# No OIDC path from GitLab to AWS is verified anywhere in this organization,
# which is open question Q2 of INTENTIUS/choudoufu#807 and the same answer the
# Forgejo workflows carry. GitLab does document one - an `id_tokens:` block
# with an `aud`, exchanged for credentials by the job through
# `sts:AssumeRoleWithWebIdentity` - and chant does not generate it (#2242). It
# is left out rather than sketched: an unverified auth block that looks
# generated is worse than a static key that says what it is.
#
# CHANT_FORGE
#
# This project builds its Ops for one of three forges. `github` posts a
# finding through `gh`. `forgejo` and `gitlab` are report-only - the finding is
# the job's own log and nothing is posted - because every posting mode chant
# has is the same `reconcilePr` activity shelling to `gh`, and on GitLab there
# is no merge-request note activity behind it either (#2231;
# INTENTIUS/chant#2256 is the issue that would add one, along with the triggers
# this file works around).
#
# So this job builds the gitlab Ops, and says so rather than leaving the
# variable unset: unset defaults to `github`, whose `live-discover` opens a
# GitHub issue and would fail on every scheduled run. It said `forgejo` when
# this file landed, because that was the only report-only value src/forge.ts
# offered; it has its own now (#807), and both guards read this value back
# against that list rather than against a literal of their own, so a value
# `chant run` would throw on cannot sit here unnoticed.
#
# Being a forge this project builds for is not the same as being one it
# generates for: `npm run generate` still emits two trees and never this file.
# src/forge.ts says why the two lists are different lists.
#
# The choudoufu release is pinned by version and verified against the SHA256
# that release published, the same line the generated workflows install. A
# scheduled job re-runs unattended, and a tag can be moved or an asset
# replaced without the run noticing.

stages:
  - scheduled-ops

variables:
  CHANT_FORGE: gitlab
  # The provider reads var.aws_region and choudoufu's tagging-API sweep reads
  # the SDK's AWS_REGION. AWS_REGION is one project CI/CD variable; this makes
  # the Terraform one follow it, so the two cannot disagree.
  TF_VAR_aws_region: $AWS_REGION

live-discover:
  stage: scheduled-ops
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CHANT_SCHEDULED_OP == "live-discover"'
  script:
    - npm ci --no-audit --no-fund
    - curl -fsSL -o /tmp/choudoufu_v0.15.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.15.0/choudoufu_v0.15.0_linux_amd64.tar.gz && echo "c5a40433bd159c1bb2596fbd8005ee4886f144a150f96c7219ac1e23298c50d3  /tmp/choudoufu_v0.15.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.15.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
    - npx chant run live-discover
