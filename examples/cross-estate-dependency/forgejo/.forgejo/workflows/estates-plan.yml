# estates-plan.yml - generated by examples/cross-estate-dependency/generate.ts. DO NOT EDIT.
# Regenerate with: CHANT_FORGE=forgejo npm run generate
# The Op this job runs is examples/cross-estate-dependency/src/estates-plan.op.ts.
# The network-then-service order is phase order inside the Op, not an edge in this file.

on:
  pull_request:
    branches:
      - main

env:
  CHANT_FORGE: forgejo
  AWS_REGION: '${{ vars.AWS_REGION }}'
  TF_VAR_aws_region: '${{ vars.AWS_REGION }}'

concurrency:
  group: estates-plan
  cancel-in-progress: false

jobs:
  estates-plan:
    runs-on: docker
    container: node:22
    env:
      AWS_ACCESS_KEY_ID: '${{ secrets.CHOUDOUFU_PLAN_ACCESS_KEY_ID }}'
      AWS_SECRET_ACCESS_KEY: '${{ secrets.CHOUDOUFU_PLAN_SECRET_ACCESS_KEY }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: curl -fsSL -o /tmp/choudoufu_v0.17.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.17.0/choudoufu_v0.17.0_linux_amd64.tar.gz && echo "f12d2975474b103be6f0f29a3dae6e81bbc876e70b5b95b49cc444ffbacb1fa5  /tmp/choudoufu_v0.17.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.17.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
      - run: npx chant run estates-plan
        env:
          GITHUB_TOKEN: '${{ github.token }}'
