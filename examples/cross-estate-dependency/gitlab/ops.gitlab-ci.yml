# ops.gitlab-ci.yml - generated by examples/cross-estate-dependency/generate.ts. DO NOT EDIT.
# Regenerate with: CHANT_FORGE=gitlab npm run generate
# Each job below runs the Op its own name is: examples/cross-estate-dependency/src/<job>.op.ts.
# The network-then-service order is phase order inside the Op, not an edge in this file.

# chant Ops (#927, #2084, #2293) — one job per Op under stage "ops", each
# selected by its own rules:. A merge_request_event or push job needs no
# setup; its rule fires on the event itself.
#
#   estates-plan: merge_request_event onto main, finding-mode report
#   estates-apply: push to main, finding-mode report — a gated apply stays green, its pending gate in the log and in chant-gate-estates-apply.md

stages:
  - ops

variables:
  CHANT_FORGE: gitlab
  TF_VAR_aws_region: '$AWS_REGION'

estates-plan:
  stage: ops
  image: node:22
  resource_group: estates-plan
  id_tokens:
    CHANT_ID_TOKEN:
      aud: '$CI_SERVER_URL'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  script:
    - echo "$CHANT_ID_TOKEN" > "$CI_PROJECT_DIR/.chant-id-token.jwt" && export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_PROJECT_DIR/.chant-id-token.jwt" && export AWS_ROLE_ARN="$CHOUDOUFU_PLAN_ROLE_ARN" && export AWS_ROLE_SESSION_NAME="gitlab-ci-$CI_PIPELINE_ID"
    - npm ci --no-audit --no-fund
    - curl -fsSL -o /tmp/choudoufu_v0.17.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.17.0/choudoufu_v0.17.0_linux_amd64.tar.gz && echo "f12d2975474b103be6f0f29a3dae6e81bbc876e70b5b95b49cc444ffbacb1fa5  /tmp/choudoufu_v0.17.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.17.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
    - npx chant run estates-plan

estates-apply:
  stage: ops
  image: node:22
  resource_group: estates-apply
  id_tokens:
    CHANT_ID_TOKEN:
      aud: '$CI_SERVER_URL'
  variables:
    CHANT_GATE_SUMMARY: chant-gate-estates-apply.md
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - echo "$CHANT_ID_TOKEN" > "$CI_PROJECT_DIR/.chant-id-token.jwt" && export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_PROJECT_DIR/.chant-id-token.jwt" && export AWS_ROLE_ARN="$CHOUDOUFU_APPLY_ROLE_ARN" && export AWS_ROLE_SESSION_NAME="gitlab-ci-$CI_PIPELINE_ID"
    - npm ci --no-audit --no-fund
    - curl -fsSL -o /tmp/choudoufu_v0.17.0_linux_amd64.tar.gz https://github.com/INTENTIUS/choudoufu/releases/download/v0.17.0/choudoufu_v0.17.0_linux_amd64.tar.gz && echo "f12d2975474b103be6f0f29a3dae6e81bbc876e70b5b95b49cc444ffbacb1fa5  /tmp/choudoufu_v0.17.0_linux_amd64.tar.gz" | sha256sum -c - && tar -xzf /tmp/choudoufu_v0.17.0_linux_amd64.tar.gz -C /usr/local/bin choudoufu && choudoufu version
    - npx chant run estates-apply --gated-exit 0
  artifacts:
    when: always
    paths:
      - chant-gate-estates-apply.md
    expire_in: '30 days'
