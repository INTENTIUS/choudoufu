apiVersion: v1
kind: ServiceAccount
metadata:
  name: choudoufu-plan
  namespace: tofu-records-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: choudoufu-records-plan
  namespace: tofu-records-prod
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: choudoufu-records-plan
  namespace: tofu-records-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: choudoufu-records-plan
subjects:
  - kind: ServiceAccount
    name: choudoufu-plan
    namespace: tofu-records-prod
