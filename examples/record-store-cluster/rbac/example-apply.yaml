apiVersion: v1
kind: ServiceAccount
metadata:
  name: choudoufu-apply
  namespace: tofu-records-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: choudoufu-records-apply
  namespace: tofu-records-prod
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: choudoufu-records-apply
  namespace: tofu-records-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: choudoufu-records-apply
subjects:
  - kind: ServiceAccount
    name: choudoufu-apply
    namespace: tofu-records-prod
