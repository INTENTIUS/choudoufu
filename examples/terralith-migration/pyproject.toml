[project]
name = "tlmig"
version = "0.1.0"
description = "choudoufu example: migrating a terralith monolith into per-team estates by retagging"
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[project.scripts]
tlmig = "tlmig.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tlmig"]
