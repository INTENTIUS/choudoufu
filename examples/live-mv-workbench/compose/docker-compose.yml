# The live-mv demo stack: two containers, one command.
#
#   floci  — the AWS emulator the demo runs against, so no credentials and
#            nothing to clean up. Pinned image by default; FLOCI_IMAGE overrides.
#   demo   — marimo serving demo.py, pointed at floci. By default its
#            choudoufu binary is the pinned release the docs measure
#            against, downloaded at build time, nothing else needed;
#            `just up source` builds it from this checkout's own code
#            instead. Both selected by the justfile through BUILD_MODE.
#
# Started by the justfile: `just up`. The demo is at http://localhost:2718.
services:
  floci:
    image: ${FLOCI_IMAGE:-ghcr.io/lex00/floci@sha256:c55d74e13e96c8b132056677337dba0084bb0b427cb039be2dbf9a8b7efc0948}
    ports:
      - "127.0.0.1:4650:4566"
    networks:
      default:
        aliases: ["000000000000.floci"]

  demo:
    build:
      context: ../../..            # repo root: BUILD_MODE=source needs the whole checkout
      dockerfile: examples/live-mv-workbench/compose/Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-release}
        CHOUDOUFU_VERSION: ${CHOUDOUFU_VERSION:-v0.10.1}   # the justfile reads this from tlmig/config.py
        FORK_LABEL: ${FORK_LABEL:-dev}                     # the justfile sets this from `git describe`; source mode only
    depends_on:
      - floci
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      TLMIG_ACCOUNT: "000000000000"     # floci's account: preflight fences to it
      TF_PLUGIN_CACHE_DIR: /plugins
      CHOUDOUFU_BIN: /usr/local/bin/choudoufu
      # release mode: the exact pinned tag, so preflight's normal check runs
      # (the downloaded binary reports it). source mode: "local", so
      # preflight accepts this checkout's own describe stamp instead of
      # asserting an exact release tag it was never going to match. The
      # justfile sets this to match whichever BUILD_MODE it built.
      CHOUDOUFU_VERSION: ${RUNTIME_CHOUDOUFU_VERSION:-v0.10.1}
    volumes:
      - plugins:/plugins               # AWS provider cache, downloaded once, kept
    ports:
      - "127.0.0.1:2718:2718"

volumes:
  plugins:
    name: live-mv-demo-plugins
