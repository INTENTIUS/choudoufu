name: terragrunt-choudoufu-demo

# Terragrunt's own CLI, with choudoufu as its binary (root.hcl). No other tool
# runs the infrastructure: a pull request runs `terragrunt run --all --out-dir
# <dir> -- plan`, posts the plan as a comment and keeps <dir>; a merge, once a
# person has approved the pull request, fetches that <dir> and runs `terragrunt
# run --all --out-dir <dir> -- apply`. The plan applied is the plan reviewed.
# The report steps only read the saved plans for behold.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  TG_NON_INTERACTIVE: "true"
  TG_NO_COLOR: "true"
  TG_LOG_FORMAT: bare
  TF_IN_AUTOMATION: "1"
  TF_CLI_CONFIG_FILE: /etc/demo/tofu-mirror.tfrc
  AWS_ENDPOINT_URL: http://floci:4566
  # choudoufu addresses its record store bucket virtual-hosted; demo-records
  # forwards those requests to floci path-style (the demo host's compose file).
  AWS_ENDPOINT_URL_S3: http://demo-records:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  # Where behold reads the run's report and index row (the same bucket and
  # prefix as the other demos). chant-report is chant's `terraform report`.
  CHANT_REPORTS: http://floci:4566/demo-reports/demo
  # Where the pull request's plan files are kept for the merge, one archive per
  # head commit of the pull request.
  SAVED_PLANS: http://floci:4566/demo-terragrunt-choudoufu-state/saved-plans
  FORGEJO_ACTIONS: "true"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: docker
    container: demo-terragrunt-choudoufu:local
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - name: Plan network, app and edge
        run: |
          set -o pipefail
          terragrunt run --all --out-dir "$RUNNER_TEMP/plans" -- plan 2>&1 | tee "$RUNNER_TEMP/plan.txt"
      - name: Keep the plan files for the merge
        env:
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
        run: |
          tar -C "$RUNNER_TEMP/plans" -czf - . | curl -fsS -o /dev/null -X PUT --data-binary @- "$SAVED_PLANS/$HEAD_SHA.tar.gz"
      - name: Write the plan's report for behold
        env:
          PR: '${{ github.event.pull_request.number }}'
        run: |
          for u in network app edge; do
            (cd "$u" && terragrunt run --log-level error -- show -json "$RUNNER_TEMP/plans/$u/tfplan.tfplan" > "$RUNNER_TEMP/$u.json")
          done
          terragrunt-plan-json --repo "$PWD" network="$RUNNER_TEMP/network.json" app="$RUNNER_TEMP/app.json" edge="$RUNNER_TEMP/edge.json" > "$RUNNER_TEMP/plan.json"
          chant-report --stage tf-plan --plan "$RUNNER_TEMP/plan.json" --pull-request "$PR" \
            --binary choudoufu --repo "$PWD" --to "$CHANT_REPORTS"
      - name: Post the plan on the pull request
        if: always()
        env:
          API: '${{ github.server_url }}/api/v1/repos/${{ github.repository }}'
          PR: '${{ github.event.pull_request.number }}'
          TOKEN: '${{ github.token }}'
        run: |
          jq -Rs '{body: ("<!-- terragrunt-choudoufu-plan -->\nterragrunt run --all plan (choudoufu):\n\n```\n" + . + "\n```")}' "$RUNNER_TEMP/plan.txt" \
            | curl -fsS -o /dev/null -H "Authorization: token $TOKEN" -H 'content-type: application/json' -X POST -d @- "$API/issues/$PR/comments"
  apply:
    if: github.event_name == 'push'
    runs-on: docker
    container: demo-terragrunt-choudoufu:local
    concurrency:
      group: terragrunt-choudoufu-apply
      cancel-in-progress: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - name: Require a person's approving review of the merged pull request
        env:
          API: '${{ github.server_url }}/api/v1/repos/${{ github.repository }}'
          SHA: '${{ github.sha }}'
          TOKEN: '${{ github.token }}'
        run: |
          pr="$(curl -fsS -H "Authorization: token $TOKEN" "$API/commits/$SHA/pull" | jq -r '.number // empty')"
          [ -n "$pr" ] || { echo "no pull request merged $SHA; nothing here applies it" >&2; exit 1; }
          curl -fsS -H "Authorization: token $TOKEN" "$API/pulls/$pr/reviews" | jq -e 'any(.[]; .state == "APPROVED")' >/dev/null \
            || { echo "pull request $pr has no approving review" >&2; exit 1; }
          head="$(curl -fsS -H "Authorization: token $TOKEN" "$API/pulls/$pr" | jq -r '.head.sha')"
          echo "HEAD_SHA=$head" >> "$GITHUB_ENV"
      # The plan files are the ones the pull request's job made and posted. Each
      # carries the whole joint plan; choudoufu plans the live system again and
      # refuses (exit status 3) if it no longer matches them.
      - name: Fetch the reviewed plan files
        run: |
          mkdir -p "$RUNNER_TEMP/plans"
          curl -fsS "$SAVED_PLANS/$HEAD_SHA.tar.gz" | tar -C "$RUNNER_TEMP/plans" -xzf -
          for u in network app edge; do
            (cd "$u" && terragrunt run --log-level error -- show -json "$RUNNER_TEMP/plans/$u/tfplan.tfplan" > "$RUNNER_TEMP/$u.json")
          done
          terragrunt-plan-json --repo "$PWD" network="$RUNNER_TEMP/network.json" app="$RUNNER_TEMP/app.json" edge="$RUNNER_TEMP/edge.json" > "$RUNNER_TEMP/plan.json"
      - name: Apply the reviewed plan to network, app and edge
        run: terragrunt run --all --out-dir "$RUNNER_TEMP/plans" -- apply
      - name: Write the apply's report for behold
        run: |
          # A plan made after the apply: its prior_state holds the values the first plan left unknown.
          terragrunt run --all plan -- -out=tfplan >/dev/null
          for u in network app edge; do
            (cd "$u" && terragrunt run --log-level error -- show -json tfplan > "$RUNNER_TEMP/$u.json")
          done
          terragrunt-plan-json --repo "$PWD" network="$RUNNER_TEMP/network.json" app="$RUNNER_TEMP/app.json" edge="$RUNNER_TEMP/edge.json" > "$RUNNER_TEMP/after.json"
          chant-report --stage tf-apply --plan "$RUNNER_TEMP/plan.json" --applied "$RUNNER_TEMP/after.json" \
            --binary choudoufu --repo "$PWD" --to "$CHANT_REPORTS"
