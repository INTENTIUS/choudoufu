baseURL = "https://intentius.io/choudoufu/"
title = "choudoufu"
theme = "hugo-book"
enableGitInfo = false

[params]
  # The release every measured figure on this site describes. Pages state it
  # with {{< version >}} rather than typing it, so a release bump is one edit
  # here and never a page that quietly still names the previous one.
  # Bump this in the same commit that tags a release.
  choudoufuVersion = "v0.5.0"
  BookTheme = "light"
  BookSection = "docs"
  BookToC = true
  BookRepo = "https://github.com/INTENTIUS/choudoufu"
  BookEditPath = ""
  BookDateFormat = "2006-01-02"
  BookSearch = true
  BookFavicon = "favicon.ico"

[markup.goldmark.renderer]
  unsafe = true

# Images in markdown resolve through layouts/_default/_markup/render-image.html,
# which looks in site/assets first, so `![](diagram-pieces.svg)` works from any
# page depth under the /choudoufu/ base.

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
