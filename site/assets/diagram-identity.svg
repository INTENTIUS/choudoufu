<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268"
     role="img" aria-labelledby="id-title id-desc">
  <title id="id-title">How a plan finds a resource again without a state file</title>
  <desc id="id-desc">A configuration address is written onto the live resource
  as two tags at create time. A later plan lists resources by tag, reads the
  address back, and rebuilds prior state from it.</desc>

  <style>
    .ink   { fill: #241f16; }
    .muted { fill: #6b5f4e; }
    .card  { fill: #f7f3e6; }
    .dim   { fill: #ebe4d2; }
    .rule  { stroke: #ded5c0; }
    .brass { stroke: #c98a3d; }
    text   { font-family: Georgia, "Iowan Old Style", serif; }
    .h    { font-size: 14px; font-weight: 700; }
    .l    { font-size: 12.5px; }
    .s    { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#c98a3d"/>
    </marker>
  </defs>

  <text x="16" y="24" class="s muted">At apply</text>

  <rect x="14" y="36" width="196" height="62" rx="6" class="dim"/>
  <rect x="14" y="36" width="196" height="62" rx="6" fill="none" class="rule"/>
  <text x="30" y="60" class="h ink">your configuration</text>
  <text x="30" y="80" class="mono ink">aws_vpc.main</text>

  <path d="M 218 67 H 292" class="brass" stroke-width="1.6" fill="none" marker-end="url(#b)"/>
  <text x="255" y="58" class="l muted" text-anchor="middle">stamped</text>

  <rect x="300" y="26" width="300" height="82" rx="6" class="card"/>
  <rect x="300" y="26" width="300" height="82" rx="6" fill="none" class="rule"/>
  <text x="318" y="48" class="h ink">the live resource</text>
  <text x="318" y="70" class="mono ink">tofu-estate  = prod-networking</text>
  <text x="318" y="90" class="mono ink">tofu-address = aws_vpc.main</text>

  <line x1="14" y1="132" x2="706" y2="132" class="rule" stroke-dasharray="3 4"/>

  <text x="16" y="160" class="s muted">At the next plan, with no state file</text>

  <rect x="14" y="172" width="196" height="62" rx="6" class="card"/>
  <rect x="14" y="172" width="196" height="62" rx="6" fill="none" class="rule"/>
  <text x="30" y="196" class="h ink">list by tag</text>
  <text x="30" y="216" class="l muted">the tagging API, or the</text>
  <text x="30" y="232" class="l muted">service's own list call</text>

  <path d="M 218 200 H 292" class="brass" stroke-width="1.6" fill="none" marker-end="url(#b)"/>

  <rect x="300" y="164" width="180" height="70" rx="6" class="card"/>
  <rect x="300" y="164" width="180" height="70" rx="6" fill="none" class="rule"/>
  <text x="318" y="188" class="h ink">read the tags</text>
  <text x="318" y="210" class="l muted">the address comes</text>
  <text x="318" y="226" class="l muted">back off the resource</text>

  <path d="M 488 200 H 562" class="brass" stroke-width="1.6" fill="none" marker-end="url(#b)"/>

  <rect x="570" y="164" width="136" height="70" rx="6" class="dim"/>
  <rect x="570" y="164" width="136" height="70" rx="6" fill="none" class="rule"/>
  <text x="586" y="188" class="h ink">prior state</text>
  <text x="586" y="210" class="l muted">rebuilt, used,</text>
  <text x="586" y="226" class="l muted">then discarded</text>
</svg>
