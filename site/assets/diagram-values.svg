<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330"
     role="img" aria-labelledby="v-title v-desc">
  <title id="v-title">Every managed instance has a record, of one of two kinds, in one of three stores</title>
  <desc id="v-desc">Every managed resource instance has one record. A resource
  with a live object gets an identity record, which holds what a read of the
  live object cannot return; its ownership is the marker on the resource. A
  record-backed resource, one with no live object, gets an object record, which is the only copy of
  its value. Records live in a local directory, an S3 bucket or Kubernetes
  Secrets, one object per instance, written conditionally with no lock.</desc>

  <style>
    .ink   { fill: #241f16; }
    .muted { fill: #6b5f4e; }
    .card  { fill: #f7f3e6; }
    .dim   { fill: #ebe4d2; }
    .rule  { stroke: #ded5c0; }
    .brass { stroke: #c98a3d; }
    .warn  { stroke: #c98a3d; fill: #f8e9cc; }
    text   { font-family: Georgia, "Iowan Old Style", serif; }
    .h    { font-size: 14px; font-weight: 700; }
    .l    { font-size: 12.5px; }
    .s    { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  </style>
  <defs>
    <marker id="c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#c98a3d"/>
    </marker>
  </defs>

  <rect x="14" y="72" width="188" height="76" rx="6" class="dim"/>
  <rect x="14" y="72" width="188" height="76" rx="6" fill="none" class="rule"/>
  <text x="30" y="98" class="h ink">a managed instance</text>
  <text x="30" y="120" class="l muted">is there a live object</text>
  <text x="30" y="136" class="l muted">to read back?</text>

  <g class="brass" stroke-width="1.6" fill="none">
    <path d="M 210 100 H 258 L 258 56 H 316" marker-end="url(#c)"/>
    <path d="M 210 120 H 258 L 258 164 H 316" marker-end="url(#c)"/>
  </g>

  <text x="262" y="50" class="s muted">yes</text>
  <text x="262" y="182" class="s muted">no</text>

  <rect x="324" y="14" width="382" height="92" rx="6" class="card"/>
  <rect x="324" y="14" width="382" height="92" rx="6" fill="none" class="rule"/>
  <text x="342" y="38" class="h ink">An identity record</text>
  <text x="342" y="58" class="l muted">what a read cannot return: an import identity,</text>
  <text x="342" y="74" class="l muted">arguments the API never echoes, provisioner taint</text>
  <text x="342" y="94" class="l ink">lose it: a slower plan. The marker still owns the resource</text>

  <rect x="324" y="120" width="382" height="92" rx="6" class="warn"/>
  <text x="342" y="144" class="h ink">An object record</text>
  <text x="342" y="164" class="mono ink">null_resource  terraform_data  random_*  time_*  tls_*</text>
  <text x="342" y="182" class="l muted">the whole value, secrets included, in clear</text>
  <text x="342" y="200" class="l ink">lose it: the resource. This is the only copy</text>


  <rect x="14" y="246" width="692" height="72" rx="6" class="dim"/>
  <rect x="14" y="246" width="692" height="72" rx="6" fill="none" class="rule"/>
  <text x="30" y="270" class="h ink">Both kinds live in the record store</text>
  <text x="30" y="290" class="l muted">a local directory, an S3 bucket, or Secrets in a cluster</text>
  <text x="30" y="308" class="l muted">one object per instance, every write conditional, nothing locked</text>
</svg>
