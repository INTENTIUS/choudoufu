<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262"
     role="img" aria-labelledby="v-title v-desc">
  <title id="v-title">Which resources need a record store, and which do not</title>
  <desc id="v-desc">A resource with a cloud twin recovers its values by reading
  the live object. A resource with no cloud twin has nothing to read, so its
  value is held in a record store. Secret-generating resources are recorded
  too, in clear, the way a stock state file holds them; setting strict secrets
  to refuse is what turns that into a refusal.</desc>

  <style>
    .ink   { fill: #241f16; }
    .muted { fill: #6b5f4e; }
    .card  { fill: #f7f3e6; }
    .dim   { fill: #ebe4d2; }
    .rule  { stroke: #ded5c0; }
    .brass { stroke: #c98a3d; }
    .warn  { stroke: #c98a3d; fill: #f8e9cc; }
    text   { font-family: Georgia, "Iowan Old Style", serif; }
    .h    { font-size: 14px; font-weight: 700; }
    .l    { font-size: 12.5px; }
    .s    { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  </style>
  <defs>
    <marker id="c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#c98a3d"/>
    </marker>
  </defs>

  <rect x="14" y="86" width="188" height="76" rx="6" class="dim"/>
  <rect x="14" y="86" width="188" height="76" rx="6" fill="none" class="rule"/>
  <text x="30" y="112" class="h ink">a declared resource</text>
  <text x="30" y="134" class="l muted">does the cloud hold</text>
  <text x="30" y="150" class="l muted">anything to read back?</text>

  <g class="brass" stroke-width="1.6" fill="none">
    <path d="M 210 110 H 258 L 258 48 H 316" marker-end="url(#c)"/>
    <path d="M 210 124 H 258 L 258 130 H 316" marker-end="url(#c)"/>
    <path d="M 210 138 H 258 L 258 208 H 316" marker-end="url(#c)"/>
  </g>

  <text x="262" y="42" class="s muted">yes</text>
  <text x="262" y="124" class="s muted">no</text>
  <text x="262" y="202" class="s muted">secret</text>

  <rect x="324" y="22" width="382" height="56" rx="6" class="card"/>
  <rect x="324" y="22" width="382" height="56" rx="6" fill="none" class="rule"/>
  <text x="342" y="45" class="h ink">Nothing to store</text>
  <text x="342" y="65" class="l muted">values come off the live object on every plan</text>

  <rect x="324" y="102" width="382" height="72" rx="6" class="card"/>
  <rect x="324" y="102" width="382" height="72" rx="6" fill="none" class="rule"/>
  <text x="342" y="125" class="h ink">One small record</text>
  <text x="342" y="145" class="mono ink">null_resource  terraform_data  time_*</text>
  <text x="342" y="164" class="l muted">in Parameter Store, S3, or a local directory</text>

  <rect x="324" y="182" width="382" height="70" rx="6" class="warn"/>
  <text x="342" y="205" class="h ink">One record, held in clear</text>
  <text x="342" y="224" class="mono ink">random_password  random_bytes  tls_*</text>
  <text x="342" y="243" class="l muted">refused only under strict { secrets = "refuse" }</text>
</svg>
