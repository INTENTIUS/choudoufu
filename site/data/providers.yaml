# The platforms choudoufu runs on, and the one place each platform's answer
# to a concept is written down (#1055). The providers shortcode renders a
# row per platform for one key; live/site_slots_test.go requires every
# platform whose status is not not-planned to have a hub with the five slots.
keys:
  identity: Where a resource's identity lives
  values: Where values the platform cannot hold go
  effects: How an effect with nothing to read back is recorded
  cache: What the state file is
  gate: What fences a write
  inventory: How anyone lists an estate without the tool
  sweep: What adoption and discovery cost
  delete: What happens to a marked object nobody declares
providers:
  - id: aws
    name: AWS
    status: proven
    status_label: "Every headline stage passes on every core estate against the pinned emulator, and two estates have run on a real account."
    cells:
      identity: "Two resource tags, `tofu-estate` and `tofu-address`, written on the create call. About half the provider's types have no tag surface; those derive their identity from configuration or hold it in the record store."
      values: "A record store you declare or get by default: Parameter Store, S3, or a local directory, one record per instance under your IAM."
      effects: "A receipt: an ordinary resource, by convention an SSM parameter holding a hash of the effect's input, that appears in your plan."
      cache: "`choudoufu-cache.tfstate` under the data dir. Never consulted for ownership; when it and the live system disagree, live wins; losing it costs a read."
      gate: "IAM conditions on `aws:ResourceTag/tofu-estate` and `aws:RequestTag/tofu-estate`. They fence reads and writes, per resource, and bind the credential rather than the binary."
      inventory: "`aws resourcegroupstaggingapi get-resources --tag-filters Key=tofu-estate,Values=<estate>`"
      sweep: "One `GetResources` call filtered on the marker, whatever else the account holds. The estate sweep on adoption is the expensive step; a plan of an adopted estate is at call parity with stock."
      delete: "Proposed for deletion under the default policy, because the marker is its own scope."
  - id: kubernetes
    name: Kubernetes
    status: soon
    status_label: "Every object-metadata type plans, carries the estate label, is swept for orphans, and is fenced by one admission policy that reads it; the gauntlet runs its stages on a kind cluster in a lane of its own, where the first estate clears every applicable stage, migration from a stock state included (#1073)."
    cells:
      identity: "One label, `tofu-estate`, written on the create; the object is re-bound through group, kind, namespace and name. A label value is capped at 63 characters and cannot carry a config address, so the address stays off the object. `generateName` is refused."
      values: "Not yet designed."
      effects: "Not yet designed."
      cache: "The same file and the same three rules."
      gate: "One `ValidatingAdmissionPolicy` (`live/kubernetes/estate-boundary.yaml`) whose CEL reads the label off `oldObject` and `object` and asks the authorizer whether the caller holds `use` on `estates.choudoufu.intentius.io/<estate>`; the grant is a ClusterRole. It fences create, update and delete only, never list or get, not subresources, and it is a cluster-wide object a cluster admin installs. Until it is installed the label is advisory."
      inventory: "`kubectl get <kind> -A -l tofu-estate=<estate>`, one kind at a time; `/apis` lists every kind the cluster serves, CRDs included."
      sweep: "One cluster-wide, label-selected list per kind the provider has a type for, plus the two discovery calls that say which kinds the cluster serves. Each list returns only the estate's objects and does not grow with the cluster; there is no one-call form."
      delete: "Proposed for deletion, as on AWS, once two exclusions have run: an object with an owner reference, or one written only by the control plane, was made by a controller and is never an orphan. A controller copies template labels, so a marker in a pod template lands on Pods and ReplicaSets nobody declared; those are the objects the exclusion keeps out."
